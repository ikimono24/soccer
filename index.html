// key: "cup"=欧州カップ / "ENG" 等=その国の1部+2部 / "ENG1" 等=そのリーグ
function scorerTeams(key) {
  if (key === "cup") return G.teams;
  const cid = key.slice(0, 3), d = key.length > 3 ? Number(key.slice(3)) : 0;
  return G.teams.filter(t => t.country === cid && (!d || t.division === d));
}
// stat: "goals"=得点 / "assists"=アシスト
function topScorers(key, n = 10, stat = "goals") {
  const gk = (key === "cup" ? "cup_" : "league_") + stat;
  const all = [];
  for (const t of scorerTeams(key)) for (const p of t.roster) all.push({ p, t });
  all.sort((a, b) => ((b.p[gk] || 0) - (a.p[gk] || 0)) || (getOvr(b.p) - getOvr(a.p)));
  return all.slice(0, n).filter(x => (x.p[gk] || 0) > 0).map(x => ({ name: x.p.name, team: x.t.name, mine: x.t === me(), goals: x.p[gk] }));
}

// シーズン終了時に、全リーグの最終順位・得点王・アシスト王などを歴代記録として残す（昇格・降格の前に呼ぶ）
function archiveSeason() {
  const mine = me();
  const pack = rows => rows.map(r => [r.name, r.team, r.goals]);
  const rec = { year: G.season_year, club: mine.name, country: G.country, leagues: {}, cup: null, my: null };
  for (const key of leagueKeys()) {
    const ts = keyTeams(key).slice().sort(tableSort);
    rec.leagues[key] = {
      table: ts.map(t => [t.name, t.won, t.drawn, t.lost, t.gf, t.ga, t.points]),
      goals: pack(topScorers(key, 10, "goals")),
      assists: pack(topScorers(key, 10, "assists")),
    };
  }
  rec.cup = { winner: G.cup_winner || null, goals: pack(topScorers("cup", 10, "goals")), assists: pack(topScorers("cup", 10, "assists")) };
  const key = myKey(), rank = keyTeams(key).slice().sort(tableSort).indexOf(mine) + 1;
  const best = st => { const k = "league_" + st; const p = mine.roster.slice().sort((a, b) => (b[k] || 0) - (a[k] || 0))[0]; return p && p[k] ? [p.name, p[k]] : null; };
  rec.my = { key, rank, n: keyTeams(key).length, w: mine.won, d: mine.drawn, l: mine.lost, gf: mine.gf, ga: mine.ga, pts: mine.points,
    cup: G.cup_result || "出場なし", topGoals: best("goals"), topAssists: best("assists") };
  G.history = G.history || [];
  G.history.push(rec);
}
function awardTopScorer(key) {
  const gk = key === "cup" ? "cup_goals" : "league_goals";
  let best = null;
  for (const t of scorerTeams(key)) for (const p of t.roster) {
    const g = p[gk] || 0;
    if (!best || g > best.g || (g === best.g && getOvr(p) > best.o)) best = { p, t, g, o: getOvr(p) };
  }
  if (best && best.g > 0) {
    const bonus = key === "cup" ? 5000 : 10000;
    best.t.money += bonus;
    return { name: best.p.name, team: best.t.name, mine: best.t === me(), bonus };
  }
  return null;
}

const snapRows = list => list.map(t => ({ name: t.name, mine: t === me(), p: t.won + t.drawn + t.lost, pts: t.points, w: t.won, d: t.drawn, l: t.lost, gf: t.gf, ga: t.ga }));
const PRIZE = { 1: 50000, 2: 30000, 3: 20000, 4: 15000, 5: 12000, 10: 8000 };

// 1か国分：最終順位の記録・賞金・昇格降格
function finalizeCountry(cid) {
  const mine = me();
  const d1 = standings(1, cid), d2 = standings(2, cid);
  const out = { id: cid, name: countryInfo(cid).name, l1: leagueName(cid, 1), l2: leagueName(cid, 2),
    d1: snapRows(d1), d2: snapRows(d2), champ1: d1[0].name, champ2: d2[0].name, my: null };
  for (const [div, list] of [[1, d1], [2, d2]]) {
    list.forEach((t, i) => {
      const rank = i + 1;
      let amt = PRIZE[rank] ?? (rank <= 10 ? 8000 : 5000);
      if (div === 2) amt = Math.trunc(amt * 0.5);
      t.money += amt;
      if (t === mine) out.my = { div, rank, amt };
    });
  }
  const byPts = (a, b) => (b.points - a.points) || ((b.gf - b.ga) - (a.gf - a.ga));
  const rel = divTeams(1, cid).slice().sort(byPts).slice(-3);
  const pro = divTeams(2, cid).slice().sort(byPts).slice(0, 3);
  // 所属の入れ替えは7月1日（新シーズン開始時）に反映する
  G.pending_moves = (G.pending_moves || []).concat(rel.map(t => [G.teams.indexOf(t), 2]), pro.map(t => [G.teams.indexOf(t), 1]));
  out.relegated = rel.map(t => ({ name: t.name, mine: t === mine }));
  out.promoted = pro.map(t => ({ name: t.name, mine: t === mine }));
  const sc = topScorers(cid + "1", 1)[0];
  out.scorer = sc || null;
  return out;
}

function seasonCeremony() {
  // 来季の欧州カップ出場クラブは昇格・降格の前に1部の最終順位で決める
  archiveSeason();
  G.next_cup = cupQualifiers(true);
  G.pending_moves = [];
  const data = finalizeCountry(G.country);
  data.moneyAfterPrize = me().money;
  data.scorers = topScorers(G.country);
  data.assists = topScorers(G.country, 10, "assists");
  data.scorerAward = awardTopScorer(G.country);
  data.abroad = COUNTRIES.filter(c => c.id !== G.country).map(c => finalizeCountry(c.id));
  data.nextCup = G.next_cup.map(i => ({ name: G.teams[i].name, country: G.teams[i].country, mine: i === G.myIdx }));
  data.myCup = G.next_cup.includes(G.myIdx);
  G.season_processed = true;
  return data;
}

// オフシーズン処理（加齢・引退・成績リセット）→ 7月1日へ
function seasonRollover(y) {
  G.season_year = y;
  const logs = [];
  const mine = me();
  // 新シーズン：他クラブの約4分の1が戦術を変える（監督交代など）
  for (const t of G.teams) if (t !== mine && (!t.tactics || rnd() < .25)) randomTactics(t);
  for (const [i, d] of G.pending_moves || []) G.teams[i].division = d;
  G.pending_moves = null;
  for (const team of G.teams) {
    for (const p of team.roster) {
      if (p.retired) continue;
      p.age += 1;
      p.fatigue = 0;
      p.injury_days = Math.max(0, (parseInt(p.injury_days) || 0) - 60);
      if (rnd() < 0.01) {
        const ch = randint(-5, 5);
        p.potential = Math.max(40, Math.min(105, p.potential + ch));
        if (team === mine && ch > 0) logs.push(L(`${p.name} はオフの間に一皮剥けたようです！（将来性UP）`, "good"));
      }
      if (rnd() < 0.002) {
        p.retired = true;
        if (team === mine) logs.push(L(`【悲報】${p.name}（${p.age}歳）が深刻な怪我の再発により、突如として現役引退を発表しました…`, "bad"));
      } else {
        const r = processEvolution(p, { seasonEnd: true });
        if (r && team === mine) logs.push(r);
      }
    }
    team.roster = team.roster.filter(p => !p.retired);
  }
  G.cup_teams = G.next_cup && G.next_cup.length ? G.next_cup : cupQualifiers(true);
  G.next_cup = null;
  G.cup_winner = null;
  G.cup_result = G.cup_teams.includes(G.myIdx) ? "出場" : "出場なし";
  resetSeasonStats();
  G.season_processed = false;
  G.lg = buildLeagueState(y);
  return logs;
}

function scoutTick() {
  const m = me();
  const logs = [];
  if (m.scout_status !== "SEARCHING") return logs;
  m.scout_timer -= 1;
  if (m.scout_timer > 0) return logs;
  m.scout_status = "READY";
  logs.push(L("🔔【スカウト報告】派遣していたスカウトが調査から帰還しました！", "rare"));
  const q = m.scout_boost ? "scout_super" : "scout_high";
  if (m.scout_boost) logs.push(L("✨ 噂の逸材をスカウトが発見しました！", "rare"));
  m.scout_candidates = [];
  const n = randint(1, 3);
  for (let i = 0; i < n; i++) {
    // 国内調査は自国中心、海外調査は世界中（日本・韓国も含む）から
    // ごくまれに伝説の名選手を発見（全盛期の年齢・能力。獲得には移籍金が必要）
    const lg = scoutLegend(m.scout_type === "overseas" ? "overseas" : "domestic");
    if (lg) { m.scout_candidates.push(lg); logs.push(L(`🌟【レジェンド発見】スカウトが、のちの伝説 ${lg.name}（${lg.age}歳）を見つけました！`, "rare")); continue; }
    const p = createPlayer({ age: randint(15, 18), pos: m.scout_target_pos, quality: q, country: m.scout_type === "overseas" ? null : G.country });
    // 国内調査ではSランクは出ない（元コードは判定がタイマー0後に行われ常に適用されていた）
    if (m.scout_type !== "overseas") p.potential = Math.min(p.potential, 90);
    m.scout_candidates.push(p);
  }
  m.scout_boost = false;
  return logs;
}

// 新しいキャリア（world は選択画面で作ったもの）
function makeNewGame(world, myIdx) {
  G = { v: 3, teams: world, myIdx, country: world[myIdx].country, date: "2025-08-01", season_year: 2025,
    cup_teams: [], next_cup: null, lg: null, news: [], season_processed: false, day: null };
  me().money = 10000;
  // 他クラブはランダムな戦術、自チームは 4-4-2・バランス・標準から（戦術タブで変えられる）
  world.forEach((t, i) => { if (i === myIdx) { t.formation = "4-4-2"; t.tactics = { style: "balance", line: "mid" }; } else randomTactics(t); });
  G.lg = buildLeagueState(2025);
  G.cup_teams = cupQualifiers(false);
  G.cup_result = G.cup_teams.includes(myIdx) ? "出場" : "出場なし";

}

// ---------------- セーブの圧縮・移行 ----------------
const PKEYS = ["name", "pos", "age", "potential", "value", "condition", "fatigue", "retired", "injury_days", "league_goals", "cup_goals",
  "career_league_goals", "career_cup_goals", "career_apps", "skill", "is_rare", ...SKILLS_ALL, "league_assists", "cup_assists", "career_assists", "nat", "height", "legend", "focus", "txp"];
const encP = p => PKEYS.map(k => p[k] ?? null);
const decP = a => { const p = {}; PKEYS.forEach((k, i) => (p[k] = a[i])); return p; };
function encodeSave(g) {
  return { ...g, enc: 1, teams: g.teams.map(t => ({ ...t, roster: t.roster.map(encP), scout_candidates: (t.scout_candidates || []).map(encP) })) };

function decodeSave(s) {
  if (!s.enc) return s;
  const out = { ...s, teams: s.teams.map(t => ({ ...t, roster: t.roster.map(decP), scout_candidates: (t.scout_candidates || []).map(decP) })) };

  return out;
}

let _hIdx = null;
function heightOf(p) {
  if (!_hIdx) { _hIdx = new Map(); for (const r of DATA.RIVAL_PLAYERS || []) if (r.height) _hIdx.set(r.name + "|" + r.pos, r.height); }
  return _hIdx.get(p.name + "|" + p.pos) || genHeight(p.pos, p.nat);
}
function normalizeTeams(teams) {
  for (const t of teams) {
    t.money = parseInt(t.money) || 0;
    for (const k of ["points", "gf", "ga", "won", "drawn", "lost"]) t[k] = parseInt(t[k]) || 0;
    t.facilities = Object.assign({ medical: 1, training: 1, youth: 1 }, t.facilities || {});
    t.formation = FORMATIONS[t.formation] ? t.formation : "4-4-2";
    t.division = t.division || 1;
    t.scout_candidates = Array.isArray(t.scout_candidates) ? t.scout_candidates.filter(p => p && typeof p === "object") : [];
    t.roster = (t.roster || []).filter(p => p && typeof p === "object");
    for (const p of [...t.roster, ...t.scout_candidates]) {

    const [rx, ry] = locL(A, r);
    let spot;
    const [bx0] = ballL(A);
    if (e.zone === "build") spot = [clamp(Math.max(rx, bx0 - .04), .36, bx0 > .55 ? Math.min(.75, bx0 + .05) : .5), clamp(ry, .15, .85)];
    else if (e.zone === "short" && fm) {
      // 短いパス：出し手の少し前・横（10m前後）へ。出したあと出し手も前へ動き直す
      const [fx, fy] = locL(A, fm);
      let sy = lerp(fy, ry, .6); if (Math.abs(sy - fy) < .08) sy = fy + (fy > .5 ? -.11 : .11);
      spot = [clamp(fx + .06, .5, .84), clamp(sy, .15, .85)];
      at(t + .35, () => putL(fm, A, clamp(fx + .09, .5, .86), clamp(fy + (sy > fy ? -.03 : .03), .15, .85)));
    }
    else if (e.zone === "box") spot = [.86, clamp(.5 + (ry > .5 ? .09 : -.09), .38, .62)];
    else if (e.route === "cross") { S.wingY = ry < .5 ? .07 : .93; spot = [clamp(Math.max(.6, bx0 + .03), .6, .8), S.wingY]; }
    else spot = [clamp(Math.min(Math.max(.6, bx0 + .04, rx), rx + .2), .55, .8), clamp(ry, .22, .78)];

    const [bxL, byL] = ballL(A);

    if (lenM > maxM) { const k = maxM / lenM; spot = [bxL + (spot[0] - bxL) * k, byL + (spot[1] - byL) * k]; }

  // ボール奪取：ボールの近くの選手が寄せ、触れたところで奪う（届くまで待つ）
  regain(e, A, D) {

    const press = () => {
      const bh = S.ball.holder;
      by.ov = [S.ball.x - .01 * dir(D), S.ball.y + .006];
      if (!S.ball.anim && dist(by.x, by.y, S.ball.x, S.ball.y) < .025 || S.simT - t0 > 4) {

  // ワンツー①：壁役に当てて、自分は相手の裏へ走る

  // ワンツー②：リターンパス（通れば走り込んだ選手へ、読まれれば相手がカット）

  // スルーパスの前に出し手が持ち上がる

  // パスカット：守備者がパスコースに入る

  // 1対1：仕掛ける側が前へ、守る側が立ちはだかる

  beat(e, A) {

  tackle(e, A, D) {

  foul(e, A) {

  // PK：キッカーとGK以外はエリアの外へ
  pk(e, A, D) {

    const others = [...S.teams[A].markers, ...S.teams[D].markers].filter(m => m !== tk && m !== g && !(m.s.role === "GK" && m.side === A));
    others.forEach((m, i) => putL(m, A, .785 + (i % 3) * .022, .2 + i * (.6 / Math.max(1, others.length - 1))));

  },
  // FK：直接狙う位置なら壁を作る。サイドならゴール前に人数をかける
  freekick(e, A, D) {
    const tk = M(e.taker); if (!tk) return .1;
    clearOv(); S.phase = "set";
    const sy = e.direct ? .5 + (Math.random() - .5) * .22 : (e.wing ? .82 : .18);
    const sx = e.direct ? .76 : .73;
    ballToL(A, sx, sy, .7, .02);
    putL(tk, A, sx - .03, sy + (sy > .5 ? .015 : -.015)); tk.lab = true;
    const used = new Set([tk]);
    if (e.direct) {
      const wall = (e.wall || []).map(M).filter(Boolean);
      const wx = sx + 9.15 / 105, wyc = lerp(sy, .5, .3);
      wall.forEach((m, i) => { putL(m, A, wx, wyc + (i - (wall.length - 1) / 2) * .028); used.add(m); });
    }

  },
  fkcross(e, A) { return aerial(e, A, M(e.taker), M(e.target), M(e.marker), e.ok); },
  // CK：ボールをコーナーへ、ゴール前に人を集める
  corner(e, A, D) {
    const tk = M(e.taker); if (!tk) return .1;
    clearOv(); S.phase = "set";
    const fy = e.wing ? .995 : .005;
    ballToL(A, .995, fy, .9, .04);
    putL(tk, A, 1.005, fy + (e.wing ? .01 : -.01)); tk.lab = true;
    const used = new Set([tk]);

      // クロスを上げる

  },
  // シュート：結果ごとにボールの行き先とGKの動きが変わる
  shot(e, A, D) {
    const s = M(e.by), g = M(e.gk) || gkOf(D); if (!s) return .1;

    else t = ensureBall(s);

  // クリア：大きく蹴り出す
  clear(e, A, D) {

      at(1.3, advance);

  // スローイン：ボールの出た位置から近くの味方へ
  throw(e, A, D) {

  // クロス：サイドの選手が縦に運んでから、ゴール前へ

// ゴール前へのハイボール（CK以外のクロス・FK）
function aerial(e, A, from, tg, mk, ok, delay = 0) {
  const px = .91, py = .5 + (Math.random() - .5) * .14;
  at(delay, () => {
    if (tg) { putL(tg, A, px, py); tg.lab = true; }
    if (mk) { putL(mk, A, px + .012, py + .01); mk.lab = true; }
    if (from && S.ball.holder !== from && dist(S.ball.x, S.ball.y, from.x, from.y) < .06) give(from);
    ballToL(A, px, py, .95, .16);
    at(.95, () => { const m = ok ? tg : mk; if (m) give(m); });
  });
  return delay + 1.05;
}
// セットプレー時のゴール前の配置（攻撃側の座標で）
function boxSetup(A, D, used, nBox, tg = null, mk = null) {
  const spots = [[.915, .44], [.915, .56], [.94, .5], [.88, .5], [.87, .37], [.87, .63]];
  const atkAll = outfield(A).filter(m => !used.has(m));
  // ゴール前に入る攻撃側：ターゲット → FW → 背の高いDF → MF
  const score = m => (m === tg ? 1000 : 0) + (m.s.role === "FW" ? 300 : m.s.role === "DF" ? 150 : 100) + (parseInt(m.p.jumping) || 30);
  const box = atkAll.slice().sort((a, b) => score(b) - score(a)).slice(0, nBox);
  box.forEach((m, i) => { putL(m, A, spots[i][0], spots[i][1]); used.add(m); });
  // 守備側：それぞれにマーカーをつける（DF優先）
  const defs = outfield(D).filter(m => !used.has(m)).sort((a, b) => (a.s.role === "DF" ? 0 : 1) - (b.s.role === "DF" ? 0 : 1));
  box.forEach((m, i) => {
    let d = (m === tg && mk && !used.has(mk)) ? mk : defs.find(x => !used.has(x));
    if (!d) return;
    putL(d, A, spots[i][0] + .014, spots[i][1] + (spots[i][1] > .5 ? -.012 : .012)); used.add(d);
  });
  putL(gkOf(D), A, .993, .5); used.add(gkOf(D));
  // 残り：攻撃側はハーフウェー付近、守備側はエリアの外
  const restA = outfield(A).filter(m => !used.has(m));
  restA.forEach((m, i) => putL(m, A, .58 + (i % 2) * .08, .25 + i * (.5 / Math.max(1, restA.length - 1))));
  const restD = outfield(D).filter(m => !used.has(m));
  restD.forEach((m, i) => putL(m, A, m.s.role === "FW" ? .55 : .8, .3 + i * (.4 / Math.max(1, restD.length - 1))));
  putL(gkOf(A), A, .1, .5);
}

// ---------- ゴール ----------
function onGoal(e) {
  const A = e.goal, D = other(A);
  const sc = M(S.lastShooter);
  S.hs = e.hs; S.as = e.as; S.stats[A].goal++;
  S.goals.push({ side: A, name: S.lastShooter ? S.lastShooter.name : "", min: e.min });
  feed(e.min, e.text, e.cls); S.flash = { t0: S.simT, side: A }; renderBoard(); renderLiveStats();
  S.phase = "celebrate";
  if (sc) for (const m of S.teams[A].markers) if (m.s.role !== "GK") m.ov = [lerp(m.x, sc.x, .75) + (Math.random() - .5) * .04, lerp(m.y, sc.y, .75) + (Math.random() - .5) * .05];
  // 喜んだあと全員が自陣へ戻り、センターから失点側のキックオフ
  at(2.0, () => {
    S.flash = null; kickoffShape(D); S.ball.holder = null;
    S.ball.anim = { fx: S.ball.x, fy: S.ball.y, tx: .5, ty: .5, t0: S.simT, dur: 1.6, arc: 0 };
    waitSettled(() => { S.ball.holder = S.kicker; at(.6, () => { S.min = S.minTo; advance(); }); });
  });
  return null;
}

function updateBall() {
  const b = S.ball;
  if (b.anim) {
    const a = b.anim, k = clamp((S.simT - a.t0) / a.dur, 0, 1);
    const tx = a.to ? a.to.x : a.tx, ty = a.to ? a.to.y : a.ty;
    const kk = a.shot ? k : (a.arc > .06 ? k : ease(k));
    b.x = lerp(a.fx, tx, kk); b.y = lerp(a.fy, ty, kk);
    b.z = Math.sin(Math.PI * k) * a.arc;
    if (a.shot) { S.trail.push([b.x, b.y]); if (S.trail.length > 10) S.trail.shift(); }
    if (k >= 1) { if (a.to) b.holder = a.to; b.anim = null; b.z = 0; }
  } else if (b.holder) {
    const m = b.holder, d = dir(m.side);
    b.x = m.x + .012 * d; b.y = m.y + .006; b.z = 0;
  }
  if (!b.anim || !b.anim.shot) { if (S.trail.length) S.trail.shift(); }
}

// ---------- 前半終了・後半・試合終了 ----------
function halftime(e) {
  S.min = 45; feed(45, `ハーフタイム（${e.hs}-${e.as}）`, "phase");
  kickoffShape("away"); S.ball.anim = null; S.ball.holder = null; S.ball.x = .5; S.ball.y = .5;
  if (SPEED === 0) { S.input = null; at(.1, advance); return; }
  at(1.2, () => { S.state = "ht"; S.ht = e; S.sel = null; lastClock = ""; renderClock(); renderPanel(); });
}
function finishHT(sub) {
  S.input = sub || null; S.ht = null; S.sel = null; S.state = "run";
  if (sub) for (const m of S.teams[S.mySide].markers) if (m.p === sub.out) { m.p = sub.in; }
  renderPanel(); at(.1, advance);
}
function secondHalf() {
  S.half = 2; S.min = 45;
  kickoffShape("away"); S.ball.anim = null; S.ball.x = .5; S.ball.y = .5;
  S.ball.holder = S.kicker;
  placeAll();
  feed(45, "後半開始", "phase");
  at(1.2, advance);
}
function fulltime(r) {
  S.min = 90; S.hs = r.hs; S.as = r.as;
  feed(90, `試合終了（${r.hs}-${r.as}）`, "phase");
  kickoffShape(null); S.ball.anim = null; S.ball.holder = null;
  S.state = "done"; lastClock = ""; renderClock(); renderBoard(); renderPanel();
}
// 「結果まで」: 残りのイベントを一気に流す
function skipToEnd() {
  S.q = [];
  for (;;) {
    const e = pull();
    if (e.t === "done") { fulltime(e.value); return; }
    if (e.t === "halftime") { feed(45, `ハーフタイム（${e.hs}-${e.as}）`, "phase"); S.input = null; continue; }
    if (e.t === "second") { S.half = 2; feed(45, "後半開始", "phase"); continue; }
    if (e.t === "attack") { S.stats[e.side].att++; feed(e.min, `${e.team} の攻撃`, "attack " + e.side); continue; }
    if (e.t === "act" && e.kind === "shot") { S.stats[e.side].shot++; S.lastShooter = e.by; continue; }
    if (e.t === "line") {
      feed(e.min, e.text, e.cls);
      if (e.goal) { S.stats[e.goal].goal++; S.goals.push({ side: e.goal, name: S.lastShooter ? S.lastShooter.name : "", min: e.min }); }
    }
  }
}

// ---------- 吹き出し ----------
function bubble(m, text, kind = "skill") { if (m) S.bubbles.push({ m, text, kind, t0: S.simT }); }
function bubbleFor(l, mm) {
  const m = mm || ["home", "away"].flatMap(s => S.teams[s].markers).find(m => l.text.includes(m.p.name));
  const k = /『(.+?)』/.exec(l.text);
  const label = k ? k[1] : /皇帝/.test(l.text) ? "皇帝" : /バンディエラ/.test(l.text) ? "バンディエラ" : /ファンタジスタ/.test(l.text) ? "ファンタジスタ" : /最後の砦/.test(l.text) ? "最後の砦" : /長身/.test(l.text) ? "高さ" : /小柄/.test(l.text) ? "身のこなし" : null;
  if (m && label) bubble(m, label, /rare/.test(l.cls) ? "rare" : "skill");
}

// ---------- 実況フィード ----------
function feed(min, text, cls = "") {
  S.feed.push({ min, text, cls });
  S.ticker = { text, cls, t0: S.simT };
  if (S.state === "run") renderLiveStats();
  renderTicker(true);
}

// ---------- 描画 ----------
const cv = () => $id("lv-pitch");
let W = 0, H = 0, DPR = 1, PX = 0, PY = 0, PW = 0, PH = 0;
function resize() {
  const c = cv(); if (!c) return;
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = c.clientWidth; H = Math.round(W * .66);
  c.width = W * DPR; c.height = H * DPR; c.style.height = H + "px";
  const mx = W * .045, my = H * .05;
  PW = W - mx * 2; PH = PW * 68 / 105; if (PH > H - my * 2) { PH = H - my * 2; PW = PH * 105 / 68; }
  PX = (W - PW) / 2; PY = (H - PH) / 2;
}
const sx = x => PX + x * PW, sy = y => PY + y * PH;
function drawPitch(g) {
  const css = getComputedStyle(document.documentElement);
  g.fillStyle = "#16492f"; g.fillRect(0, 0, W, H);
  const n = 14;
  for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? "#1d5c43" : "#226a4d"; g.fillRect(PX + PW * i / n, PY, PW / n + .5, PH); }
  g.strokeStyle = "rgba(255,255,255,.62)"; g.lineWidth = Math.max(1, W / 360);
  const mX = PW / 105, mY = PH / 68;
  g.strokeRect(PX, PY, PW, PH);
  g.beginPath(); g.moveTo(sx(.5), PY); g.lineTo(sx(.5), PY + PH); g.stroke();
  g.beginPath(); g.ellipse(sx(.5), sy(.5), 9.15 * mX, 9.15 * mY, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "rgba(255,255,255,.7)";
  g.beginPath(); g.arc(sx(.5), sy(.5), 1.6, 0, Math.PI * 2); g.fill();
  for (const s of [0, 1]) {
    const x0 = s ? PX + PW : PX, d = s ? -1 : 1;
    g.strokeRect(Math.min(x0, x0 + d * 16.5 * mX), sy(.5) - 20.15 * mY, 16.5 * mX, 40.3 * mY);
    g.strokeRect(Math.min(x0, x0 + d * 5.5 * mX), sy(.5) - 9.15 * mY, 5.5 * mX, 18.3 * mY);
    g.beginPath(); g.arc(x0 + d * 11 * mX, sy(.5), 1.4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x0 + d * 11 * mX, sy(.5), 9.15 * mX, 9.15 * mY, 0, s ? Math.PI - .93 : -.93, s ? Math.PI + .93 : .93); g.stroke();
    // ゴール（ネット）
    const gw = 7.32 * mY, gd = 2.2 * mX;
    g.save(); g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(Math.min(x0, x0 - d * gd), sy(.5) - gw / 2, gd, gw);
    g.strokeStyle = "rgba(255,255,255,.85)"; g.strokeRect(Math.min(x0, x0 - d * gd), sy(.5) - gw / 2, gd, gw); g.restore();
  }
}
function drawMarker(g, m, R) {
  const K = S.K[m.side];
  const x = sx(m.x), y = sy(m.y);
  g.fillStyle = "rgba(0,0,0,.28)"; g.beginPath(); g.ellipse(x + 1, y + R * .7, R * .9, R * .45, 0, 0, Math.PI * 2); g.fill();
  if (S.ball.holder === m) { g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 2; g.beginPath(); g.arc(x, y, R + 3.5, 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = m.s.role === "GK" ? K.gk : K.body;
  g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2); g.fill();
  g.lineWidth = Math.max(2, R * .32); g.strokeStyle = m.s.role === "GK" ? "#15211c" : K.ring; g.stroke();
}
function drawLabel(g, m, R) {
  const x = sx(m.x), y = sy(m.y) - R - 5;
  const t = shortName(m.p.name);
  g.font = `700 ${Math.round(Math.max(10, W / 36))}px "Zen Kaku Gothic New", sans-serif`;
  const w = g.measureText(t).width + 10, h = Math.max(15, W / 26);
  const bx = clamp(x - w / 2, 2, W - w - 2);
  g.fillStyle = m.side === "home" ? "rgba(8,14,11,.82)" : "rgba(8,14,11,.82)";
  roundRect(g, bx, y - h, w, h, h / 2); g.fill();
  g.fillStyle = S.K[m.side].body; g.fillRect(bx + h / 2 - 2, y - h + 3, 0, 0);
  g.fillStyle = "#f1f5ef"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(t, bx + w / 2, y - h / 2 + .5);
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawBubble(g, b, R) {
  const age = S.simT - b.t0; if (age > 1.6) return false;
  const a = age < .15 ? age / .15 : age > 1.3 ? (1.6 - age) / .3 : 1;
  const x = sx(b.m.x), y = sy(b.m.y) - R - 26 - age * 6;
  g.globalAlpha = a;
  g.font = `700 ${Math.round(Math.max(11, W / 32))}px "Zen Kaku Gothic New", sans-serif`;
  const w = g.measureText(b.text).width + 14, h = Math.max(19, W / 21);
  const bx = clamp(x - w / 2, 2, W - w - 2);
  g.fillStyle = b.kind === "rare" ? "#7a3ec2" : b.kind === "def" ? "#1f62b8" : b.kind === "atk" ? "#c4382c" : b.kind === "foul" ? "#f5d020" : "#e9a612";
  roundRect(g, bx, y - h, w, h, 6); g.fill();
  g.fillStyle = b.kind === "skill" || b.kind === "foul" ? "#1d1503" : "#fff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(b.text, bx + w / 2, y - h / 2 + .5);
  g.globalAlpha = 1; return true;
}
function drawFlash(g) {
  if (!S.flash) return;
  const age = S.simT - S.flash.t0, K = S.K[S.flash.side];
  const a = clamp(age / .2, 0, 1) * clamp((2 - age) / .4, 0, 1);
  g.globalAlpha = a * .85; g.fillStyle = K.body; g.fillRect(0, H * .36, W, H * .28);
  g.globalAlpha = a; const s = 1 + Math.max(0, .25 - age) * 1.6;
  g.save(); g.translate(W / 2, H / 2); g.scale(s, s);
  g.font = `${Math.round(W / 7.5)}px "Dela Gothic One", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,.35)"; g.strokeText("GOAL!", 0, 2);
  g.fillStyle = lum(K.body) > .6 ? "#15211c" : "#ffffff"; g.fillText("GOAL!", 0, 2);
  g.restore(); g.globalAlpha = 1;
}
function draw() {
  const c = cv(); if (!c || !S) return;
  const g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawPitch(g);
  const R = Math.max(5, PW * .016);
  const all = [...S.teams.home.markers, ...S.teams.away.markers].sort((a, b) => a.y - b.y);
  for (const m of all) drawMarker(g, m, R);
  // ボール（影→本体）
  const b = S.ball;
  for (let i = 0; i < S.trail.length; i++) { g.fillStyle = `rgba(255,255,255,${i / S.trail.length * .35})`; g.beginPath(); g.arc(sx(S.trail[i][0]), sy(S.trail[i][1]), R * .35, 0, Math.PI * 2); g.fill(); }
  const br = R * .52 * (1 + b.z * 6), lift = b.z * PH * .6;
  g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(sx(b.x) + 1, sy(b.y) + 2, R * .5, R * .28, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(sx(b.x), sy(b.y) - lift, br, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#15211c"; g.lineWidth = 1.2; g.stroke();
  for (const m of all) if (m.lab || S.ball.holder === m) drawLabel(g, m, R);
  S.bubbles = S.bubbles.filter(bb => drawBubble(g, bb, R));
  drawFlash(g);
}

// ---------- 選手の動き ----------
// 速度と加速度を持たせて走らせる（向きや速さが急に変わらない）。単位はメートル（ピッチ105m×68m）、時間は試合内の秒
const LXM = 105, LYM = 68;
function steer(m, gx, gy, dt) {
  if (m.tx == null) { m.tx = gx; m.ty = gy; m.vx = m.vx || 0; m.vy = m.vy || 0; }
  // 目標地点そのものもなめらかに動かす（目標が急に飛んでも動きはなめらか）
  const ks = Math.min(1, dt * (m.ov ? 9 : 4));
  m.tx += (gx - m.tx) * ks; m.ty += (gy - m.ty) * ks;
  const dx = (m.tx - m.x) * LXM, dy = (m.ty - m.y) * LYM, d = Math.hypot(dx, dy);
  const vmax = m.ov ? 24 : 15, slow = m.ov ? 6 : 8, amax = m.ov ? 48 : 30;
  let wx = 0, wy = 0;
  if (d > .03) { const sp = vmax * Math.min(1, d / slow); wx = dx / d * sp; wy = dy / d * sp; }
  let ax = wx - m.vx, ay = wy - m.vy; const al = Math.hypot(ax, ay), lim = amax * dt;
  if (al > lim) { ax *= lim / al; ay *= lim / al; }
  m.vx += ax; m.vy += ay;
  m.x += m.vx * dt / LXM; m.y += m.vy * dt / LYM;
}
const placeAll = () => { for (const side of ["home", "away"]) for (const m of S.teams[side].markers) { const [x, y] = target(m); m.x = m.tx = x; m.y = m.ty = y; m.vx = m.vy = 0; } };

// ---------- ループ ----------
function frame(ts) {
  const dt = Math.min(.05, (ts - (last || ts)) / 1000); last = ts;
  if (S && S.state === "run" && SPEED > 0) {
    const sdt = dt * SPEED; S.simT += sdt;
    runQueue();
    // プレス役：一番近い選手。ただし今のプレス役よりはっきり近い選手がいるときだけ交代する（ちらつき防止）
    S.press = S.press || {};
    for (const side of ["home", "away"]) {
      if (S.phase !== "play" || S.poss === side) { S.press[side] = null; continue; }
      let bm = null, bd = 9;
      for (const m of outfield(side)) { if (m.ov) continue; const d = dist(m.x, m.y, S.ball.x, S.ball.y); if (d < bd) { bd = d; bm = m; } }
      const cur = S.press[side];
      const cd = cur && !cur.ov ? dist(cur.x, cur.y, S.ball.x, S.ball.y) : 9;
      if (!cur || cur.ov || bd < cd - .04) S.press[side] = bm;
    }
    for (const side of ["home", "away"]) for (const m of S.teams[side].markers) {
      const [tx, ty] = target(m);
      const wob = S.phase === "play" && !m.ov ? .006 : 0;
      const gx = tx + Math.sin(S.simT * .8 + m.seed) * wob, gy = ty + Math.cos(S.simT * .6 + m.seed) * wob;
      steer(m, gx, gy, sdt);
    }
    updateBall();
    if (S.poss && (S.phase === "play" || S.phase === "set")) S.possT[S.poss] = (S.possT[S.poss] || 0) + sdt;
    if (S.simT - (S.statT || 0) > 1) { S.statT = S.simT; renderLiveStats(); }
    if (S.sceneDur) S.min = Math.round(lerp(S.minFrom, S.minTo, clamp((S.simT - S.sceneT0) / S.sceneDur, 0, 1)));
    renderClock(); renderTicker();
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- DOM ----------
function renderBoard() {
  if (!S) return;
  $id("lv-hs").textContent = S.hs; $id("lv-as").textContent = S.as;
}
function renderClock() {
  const txt = S.state === "done" ? "FT" : S.state === "ht" ? "HT" : S.min + "'";
  if (txt === lastClock) return; lastClock = txt;
  $id("lv-clockTxt").textContent = txt; $id("lv-clockBar").style.width = Math.min(100, S.min / 90 * 100) + "%";
}
// 実況はピッチ下のテロップ1行だけ（次の実況が来るまで表示し続ける）
function renderTicker(force) {
  const el = $id("lv-ticker"); if (!el) return;
  const t = S && S.state !== "pre" ? S.ticker : null;
  if (!t) { el.className = "lv-tickerbar idle"; el.innerHTML = `<span class="tm"></span><span class="tt">キックオフを待っています</span>`; return; }
  if (!force && el.dataset.t0 == t.t0) return;
  el.dataset.t0 = t.t0;
  const last = S.feed[S.feed.length - 1];
  el.className = "lv-tickerbar" + (/goal/.test(t.cls) ? " goal" : /save/.test(t.cls) ? " save" : /phase/.test(t.cls) ? " phase" : "");
  el.innerHTML = `<span class="tm">${last && last.min ? last.min + "'" : ""}</span><span class="tt">${esc(t.text)}</span>`;
}
function renderLiveStats() { const el = $id("lv-livestats"); if (!el) return; const h = statsHTML(true); if (h !== el._h) { el._h = h; el.innerHTML = h; } }
function renderFeed_unused() {
  const el = $id("lv-feed"); if (!el) return;
  el.innerHTML = S.feed.slice(-60).map((f, i, a) => `<li class="${esc(f.cls || "")}${i === a.length - 1 ? " now" : ""}"><span class="fm">${f.min ? f.min + "'" : ""}</span><span class="ft">${esc(f.text)}</span></li>`).join("");
  el.scrollTop = el.scrollHeight;
}
function renderPanel() {
  const box = $id("lv-panel"); if (!box) return;
  if (S.state === "ht") {
    const ht = S.ht;
    if (!S.sel) box.innerHTML = `<div class="ht"><h3>ハーフタイム</h3><p class="muted">選手交代を行いますか？ 下げる選手を選んでください。</p>
      <div class="plist">${ht.onPitch.map((p, i) => playerRow(p, { act: "lv-out", idx: i })).join("")}</div>
      <button class="btn wide" data-act="lv-none">交代しないで後半へ</button></div>`;
    else box.innerHTML = `<div class="ht"><h3>投入する選手</h3><p class="muted">${esc(S.sel.name)}（${S.sel.pos}）と交代</p>
      ${ht.bench.length ? `<div class="plist">${ht.bench.map((p, i) => playerRow(p, { act: "lv-in", idx: i })).join("")}</div>` : "<p>出場できる控え選手がいません。</p>"}
      <div class="row2"><button class="btn ghost" data-act="lv-back">選び直す</button><button class="btn" data-act="lv-none">交代しない</button></div></div>`;
  } else if (S.state === "done") {
    box.innerHTML = statsHTML();
  } else { box.innerHTML = `<div id="lv-livestats" style="display:contents"></div>`; renderLiveStats(); }
  renderCtl();
}
function statsHTML(live = false) {
  const st = S.stats, row = (lab, a, b) => { const t = a + b || 1; return `<div class="lv-statrow"><span>${a}</span><div class="lv-lab">${lab}<div class="lv-statbar"><i style="width:${a / t * 100}%;background:${S.K.home.body}"></i><i style="width:${b / t * 100}%;background:${S.K.away.body}"></i></div></div><span>${b}</span></div>`; };
  const gl = side => S.goals.filter(g => g.side === side).map(g => `${esc(shortName(g.name))} ${g.min}'`).join("<br>") || "—";
  return `<div class="lv-stats">
    <div class="lv-scorers"><div>${gl("home")}</div><div>${gl("away")}</div></div>
    ${(() => { const h = S.possT.home, w = S.possT.away, t = h + w; if (!t) return ""; const ph = Math.round(h / t * 100); return `<div class="lv-statrow"><span>${ph}%</span><div class="lv-lab">ボール支配率<div class="lv-statbar"><i style="width:${ph}%;background:${S.K.home.body}"></i><i style="width:${100 - ph}%;background:${S.K.away.body}"></i></div></div><span>${100 - ph}%</span></div>`; })()}
    ${row("シュート", st.home.shot, st.away.shot)}${row("ゴール", st.home.goal, st.away.goal)}
    ${live ? "" : `<details><summary class="muted small">実況ログ</summary><ol class="feed" style="padding:8px 0">${S.feed.map(f => `<li class="${esc(f.cls || "")}"><span class="fm">${f.min ? f.min + "'" : ""}</span><span class="ft">${esc(f.text)}</span></li>`).join("")}</ol></details>`}
  </div>`;
}

function renderCtl() {
  const el = $id("lv-ctl"); if (!el) return;
  if (S.state === "done") { el.innerHTML = `<button class="btn wide primary" data-act="lv-close">結果へ</button>`; return; }
  if (S.state === "ht") { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="seg">${SPEEDS.map(([s, l]) => `<button class="${SPEED === s ? "on" : ""}" data-act="lv-speed" data-arg="${s}">${l}</button>`).join("")}</div>`;
}
function renderShell() {

      <div class="board-row">${team(S.home, S.homeMine, "HOME")}

        ${team(S.away, !S.homeMine, "AWAY")}</div>

      <div class="lv-kits"><span class="lv-kit" style="--k1:${S.K.home.body};--k2:${S.K.home.ring}"></span>${esc(S.home.name)}<span class="lv-kit" style="--k1:${S.K.away.body};--k2:${S.K.away.ring}"></span>${esc(S.away.name)}</div></div>
    <div class="lv-tickerbar idle" id="lv-ticker" aria-live="polite"></div>
    <div id="lv-panel" class="lv-panel"></div>

  </div>`;
  live.hidden = false;
}
let last = 0;
function loop(ts) { if (!running) return; frame(ts); }
function onResize() { if (running) resize(); }

// ---- 公開する操作 ----
function start(home, away, opts, onDone) {
  SPEED = (typeof T !== "undefined" && T.liveSpeed) || 1;
  onDoneCb = onDone;
  newMatch(home, away, opts);
  document.body.classList.add("live-on");
  renderShell(); resize(); renderBoard(); renderPanel(); lastClock = ""; renderClock(); renderTicker(true);
  running = true; last = 0;
  window.addEventListener("resize", onResize);
  requestAnimationFrame(loop);
  if (SPEED === 0) { skipToEnd(); return; }
  at(1.0, advance);
}
function close() {
  running = false;

// 未設定のクラブは、クラブカラーと略称から作るオリジナルの図柄。画像を設定したクラブはその画像を表示する
const CREST_IMG = {};
const CREST_LS = "soccer_m_crests_v1";
try { Object.assign(CREST_IMG, JSON.parse(localStorage.getItem(CREST_LS) || "{}")); } catch (e) {}
const saveCrestCache = () => { try { localStorage.setItem(CREST_LS, JSON.stringify(CREST_IMG)); } catch (e) { toast("端末の保存容量が足りません", "bad"); } };
const hashStr = str => { let x = 2166136261; for (const c of str) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
const isLight = hex => { const m = /^#([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return false; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 170; };
const CREST_SHAPES = [
  "M3 2h34v21c0 10-8 15-17 19C11 38 3 33 3 23z",
  "M20 1l17 6v15c0 10-7 16-17 20C10 38 3 32 3 22V7z",
  "M7 2h26l4 5v16c0 10-8 15-17 19C11 38 3 33 3 23V7z",
];
function crest(name, size = 34) {
  if (CREST_IMG[name]) return `<img class="crest-img" src="${CREST_IMG[name]}" width="${size}" height="${size}" alt="">`;
  const hs = hashStr(name);
  let [tla, c1, c2] = (DATA.CLUB_STYLE || {})[name] || [name.slice(0, 3), "", ""];
  if (!c1) { c1 = `hsl(${hs % 360} 55% 38%)`; c2 = "#ffffff"; }
  const id = "cc" + hs.toString(36);
  const shape = CREST_SHAPES[hs % 3];
  const pat = [
    "",
    `<rect x="20" y="0" width="20" height="44" fill="${c2}"/>`,
    `<polygon points="-2,30 -2,42 42,10 42,-2" fill="${c2}"/>`,
    `<rect x="0" y="15" width="40" height="11" fill="${c2}"/>`,
    `<rect x="7" y="0" width="5" height="44" fill="${c2}"/><rect x="17.5" y="0" width="5" height="44" fill="${c2}"/><rect x="28" y="0" width="5" height="44" fill="${c2}"/>`,
    `<polygon points="0,9 20,22 40,9 40,17 20,30 0,17" fill="${c2}"/>`,
  ][(hs >> 3) % 6];
  const light = isLight(c1) && (!pat || isLight(c2));
  const fs = tla.length <= 3 ? 11.5 : tla.length === 4 ? 9.5 : 8;
  return `<svg class="crest-svg" width="${size}" height="${Math.round(size * 1.1)}" viewBox="0 0 40 44" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect width="40" height="44" fill="${c1}"/>${pat}</g>
    <path d="${shape}" fill="none" stroke="${light ? "#00000055" : "#ffffff66"}" stroke-width="1.6"/>
    <text x="20" y="${hs % 3 === 1 ? 25 : 24}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="${fs}"
      fill="${light ? "#111" : "#fff"}" stroke="${light ? "#fff" : "#000"}" stroke-opacity=".45" stroke-width="2.2" paint-order="stroke" letter-spacing=".3">${h(tla)}</text></svg>`;
}

// 画像を 96px に縮めて保存（端末＋クラウド）
async function setCrestImage(name, file) {
  try {
    const bmp = await createImageBitmap(file);
    const S = 96, cv = document.createElement("canvas"); cv.width = S; cv.height = S;
    const k = Math.min(S / bmp.width, S / bmp.height), w = bmp.width * k, hh = bmp.height * k;
    cv.getContext("2d").drawImage(bmp, (S - w) / 2, (S - hh) / 2, w, hh);
    let url = cv.toDataURL("image/webp", 0.88);
    if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/png");
    CREST_IMG[name] = url; saveCrestCache();
    if (Cloud.ready) Cloud.db.doc(`data/users/${Cloud.uid}/crest_${hashStr(name)}`).set({ kind: "crest", name, img: url }).catch(() => {});
    toast(`${name} のエンブレムを設定しました`, "good");
  } catch (e) { toast("画像を読み込めませんでした", "bad"); }
  render(); renderSheet();
}
function clearCrestImage(name) {
  delete CREST_IMG[name]; saveCrestCache();
  if (Cloud.ready) Cloud.db.doc(`data/users/${Cloud.uid}/crest_${hashStr(name)}`).delete().catch(() => {});
  render(); renderSheet();
}
async function loadCloudCrests() {
  try {
    const snap = await Cloud.db.collection(`data/users/${Cloud.uid}`).where("kind", "==", "crest").get();
    let n = 0;
    for (const d of snap.docs) { const v = d.data(); if (v && v.name && v.img && CREST_IMG[v.name] !== v.img) { CREST_IMG[v.name] = v.img; n++; } }
    if (n) { saveCrestCache(); render(); }
  } catch (e) {}
}

// ---------------- 保存（端末 + クラウド） ----------------
const LS_KEY = "soccer_m_save_v1";
function persist() {
  if (!G) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ savedAt: Date.now(), G: encodeSave(G) })); } catch (e) { /* 保存できない環境 */ }
}
let _localCache = null;
function readLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return null;
    if (_localCache && _localCache.raw === raw) return _localCache.v;
    const o = JSON.parse(raw); const v = { savedAt: o.savedAt, G: migrateSave(o.G) };
    _localCache = { raw, v }; return v;
  } catch (e) { return null; }
}
const Cloud = { db: null, uid: null, ready: false, meta: null };
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    Cloud.db = db; Cloud.uid = uid; Cloud.ready = true;
    const snap = await db.doc(`data/users/${uid}/save_meta`).get();
    Cloud.meta = snap.exists ? snap.data() : null;
    if (T.title) render();
    loadCloudCrests();
  } catch (e) { Cloud.ready = false; }
}
const CHUNK = 180000;
async function cloudSave() {
  if (!Cloud.ready || !G) return false;
  try {
    const s = JSON.stringify(encodeSave(G));
    const n = Math.ceil(s.length / CHUNK);
    for (let i = 0; i < n; i++) await Cloud.db.doc(`data/users/${Cloud.uid}/save_${i}`).set({ s: s.slice(i * CHUNK, (i + 1) * CHUNK) });
    const meta = { n, savedAt: Date.now(), date: G.date, team: me().name };
    await Cloud.db.doc(`data/users/${Cloud.uid}/save_meta`).set(meta);
    Cloud.meta = meta;
    return true;
  } catch (e) { return false; }
}
async function cloudLoad() {
  const m = Cloud.meta; let s = "";
  for (let i = 0; i < m.n; i++) { const snap = await Cloud.db.doc(`data/users/${Cloud.uid}/save_${i}`).get(); s += snap.data().s; }
  return migrateSave(JSON.parse(s));
}

const seasonEndCond = () => month() >= 5 && month() <= 6 && leagueKeys().every(leagueDone);

function startCareer(world, idx) {
  makeNewGame(world, idx);
  T.title = false; T.tab = "home"; T.world = null; T.standDiv = null; T.scorerMode = null;
  const m = me();
  beginDay([L(`✨ 2025/2026 シーズンが開幕しました！ ${m.name} の監督としてキャリアを開始します（${teamLeagueName(m)}）。`, "head"),
    L(G.cup_teams.includes(G.myIdx) ? `今季は${CUP_NAME}に出場します。` : `今季は${CUP_NAME}の出場権がありません。`)]);
}

function beginDay(carry = []) {
  T.starters = null; T.market = null;
  G.day = { phase: null, logs: carry };
  if (seasonEndCond()) {
    if (!G.season_processed) { G.day.cer = seasonCeremony(); G.day.step = 0; }
    else G.day.step = 7;
    G.day.phase = "season_end";
  } else startDayEffects();
  persist(); render();
}

function startDayEffects() {
  const d = G.day, wd = weekday(D(G.date)), m = me();
  d.bg = playBackground();   // 自分のリーグ以外で今日が試合日のもの
  if (wd <= 4) {
    d.logs.push(...randomEvent(m));
    const round = cupDates(G.season_year)[G.date];
    if (wd === 2 && round) { d.phase = "cup"; d.round = round; d.played = false; }
    else if (isMyMatchday()) { d.phase = "saturday"; d.isMatch = true; d.played = false; }
    else d.phase = "weekday";
  } else if (wd === 5) {
    d.phase = "saturday";
    d.isMatch = isMyMatchday();
    d.played = false;
  } else {
    d.phase = "sunday";
    for (const t of G.teams) for (const p of t.roster) {
      p.condition = Math.min(100, (parseInt(p.condition) || 100) + 20);
      p.fatigue = Math.max(0, (parseInt(p.fatigue) || 0) - 30);
    }
    d.logs.push(L("日曜日。全選手が休養し、体力が回復しました。"));
    const salary = m.roster.length * 100;
    m.money -= salary;
    d.logs.push(L(`💰 週次支出: 選手の給与として ${yen(salary)} を支払いました。`));
    if (m.money < 0) {
      const interest = Math.trunc(m.money * 0.02);
      m.money += interest;
      d.logs.push(L(`📉 借金利子発生: ${yen(Math.abs(interest))} が残高から引かれました。`, "bad"));
    }
    d.window = [1, 7, 8].includes(month());
    if (d.window) {
      d.logs.push(L("🛒 移籍市場がオープンしています！", "head"));
      const deals = aiTransfers();
      if (deals.length) {
        d.logs.push(L(`📰 今日の移籍ニュース（${deals.length}件）`, "sub"));
        for (const n of deals) d.logs.push(L(`${n.name}（${n.pos}・${n.age}歳・総合${n.ovr}）${n.from} → ${n.to}　${yen(n.fee)}`));
      }
      d.offer = makeRivalOffer();
      if (d.offer) d.offer.name = m.roster[d.offer.pIdx].name;
    }
  }
}

function endDay(carry = []) {
  const logs = [...carry, ...scoutTick()];
  for (const t of G.teams) for (const p of t.roster) if (p.injury_days > 0) p.injury_days -= 1;
  const wasSunday = weekday(D(G.date)) === 6;
  G.date = addDays(G.date, 1);
  logs.push(...legendMarketTick());
  if (month() === 7 && D(G.date).getUTCDate() === 1) {
    logs.push(...seasonRollover(D(G.date).getUTCFullYear()));
    logs.push(L(`✨ ${G.season_year}/${G.season_year + 1} シーズンが開幕しました！`, "head"));
  }
  beginDay(logs);
  if (wasSunday) cloudSave();
}

function skipOffseason() {
  const y = D(G.date).getUTCFullYear();
  const logs = [L("⏩ シーズン終了処理（加齢・引退・成績リセット）を行いました。", "head"), ...seasonRollover(y)];
  G.date = `${y}-07-01`;
  logs.push(L(`✨ ${y}/${y + 1} シーズンが開幕しました！`, "head"));
  beginDay(logs);
  cloudSave();
}

// ---------------- 平日の行動 ----------------
function actTrain(kind) {
  if (INTENSITY[kind]) { const logs = [L(`▶ ${shortDate(G.date)} 練習（${INTENSITY[kind].name}）`, "sub"), ...teamTraining(me(), kind)]; endDay(logs); return; }
  const m = me(); const logs = [L(`▶ ${shortDate(G.date)} ${kind === "1" ? "攻撃" : "守備"}特訓`, "sub")];
  const cands = m.roster.filter(p => p.age <= 25 && !p.retired);
  if (cands.length) {
    const tp = choice(cands);
    const s = kind === "1" ? "finishing" : "tackling";
    const label = kind === "1" ? "攻撃" : "守備";
    let gain = 1; const gym = m.facilities.training || 1;
    if (rnd() < gym * 0.15) gain = 2;
    if (tp[s] < (tp.potential ?? 80)) { tp[s] += gain; logs.push(L(`🔥【個別特訓】${tp.name} が${label}の重点指導を受け、${SKJ[s]}が ${gain} 向上しました！（ジムLv.${gym}）`, "good")); }
    else logs.push(L(`【特訓】${tp.name} は既に才能の限界まで鍛えられています。`));
  }
  for (const p of m.roster) {
    if (p.retired) continue;
    p.condition = Math.max(0, p.condition - 12);
    const r = processEvolution(p, { training: true });
    if (r) logs.push(r);
  }
  logs.push(L("チーム全体で練習を行い、体力を消費しました。"));
  endDay(logs);
}
function actRest(silent) {
  for (const p of me().roster) p.condition = Math.min(100, p.condition + 15);
  endDay([L(`▶ ${shortDate(G.date)} チームを休養させました。`, "sub")]);
}
function actRestUntilMatch() {
  let n = 0;
  while (G.day.phase === "weekday" && n < 7) { actRest(); n++; }
  toast(`${n}日間休養しました`);
}

// ---------------- 試合（リーグ・カップ） ----------------
function playLeague(live) {
  const m = me(), key = myKey(), st = G.lg[key];
  const { res, mine } = playLeagueRound(key, m);
  const label = `${leagueName(G.country, m.division)} 第${st.round + 1}節`;
  const finish = r => {
    Object.assign(res[mine.row], { hs: r.hs, as: r.as });
    G.day.results = res;
    G.day.my = { home: mine.home.name, away: mine.away.name, homeMine: mine.home === m, hs: r.hs, as: r.as, logs: r.logs, label };
    st.round += 1; G.day.played = true;
    persist(); render(); window.scrollTo(0, 0);
  };
  const opts = { myStarters: matchStarters(), myOrdered: true, playerTeam: m };
  if (live) startLive(mine.home, mine.away, { ...opts, isCup: false, title: label }, finish);
  else finish(runMatch(mine.home, mine.away, opts));
}

function cupOpponent() {
  const ct = G.cup_teams, myIdx = G.myIdx;
  if (!ct.includes(myIdx)) return null;
  for (let i = 0; i + 1 < ct.length; i += 2) {
    if (ct[i] === myIdx) return G.teams[ct[i + 1]];
    if (ct[i + 1] === myIdx) return G.teams[ct[i]];
  }
  return null;
}

function playCup(live) {
  const ct = G.cup_teams, m = me();
  const pairs = []; let mine = null;
  for (let i = 0; i < ct.length; i += 2) {
    if (i + 1 >= ct.length) { pairs.push({ bye: ct[i] }); continue; }
    const t1 = G.teams[ct[i]], t2 = G.teams[ct[i + 1]];
    const pr = { i1: ct[i], i2: ct[i + 1] };
    if (t1 === m || t2 === m) { mine = pr; pr.mine = true; }
    else { const r = runMatch(t1, t2, { isCup: true }); pr.s1 = r.hs; pr.s2 = r.as; pr.pk = r.pk; }
    pairs.push(pr);
  }
  const finish = r => {
    if (mine) { mine.s1 = r.hs; mine.s2 = r.as; mine.pk = r.pk; }
    const next = pairs.map(p => (p.bye != null ? p.bye : p.s1 > p.s2 ? p.i1 : p.i2));
    const res = pairs.map(p => (p.bye != null ? { bye: G.teams[p.bye].name } : { home: G.teams[p.i1].name, away: G.teams[p.i2].name, hs: p.s1, as: p.s2, pk: p.pk, mine: !!p.mine }));
    G.day.results = res;
    if (mine) {
      const won = (mine.i1 === G.myIdx && mine.s1 > mine.s2) || (mine.i2 === G.myIdx && mine.s2 > mine.s1);
      G.day.my = { home: G.teams[mine.i1].name, away: G.teams[mine.i2].name, homeMine: mine.i1 === G.myIdx, hs: mine.s1, as: mine.s2, pk: mine.pk, logs: r.logs, won, label: `${CUP_NAME} ${G.day.round}` };
    }
    G.cup_teams = next;
    if (mine) G.cup_result = G.day.my.won ? (next.length === 1 ? "優勝" : `${G.day.round}突破`) : `${G.day.round}敗退`;
    if (next.length === 1) {
      const w = G.teams[next[0]];
      w.money += 30000;
      G.cup_winner = w.name;
      G.day.final = { winner: w.name, mine: w === m, scorers: topScorers("cup"), award: awardTopScorer("cup") };
    }
    G.day.played = true;
    persist(); render(); window.scrollTo(0, 0);
  };
  if (mine) {
    const t1 = G.teams[mine.i1], t2 = G.teams[mine.i2];
    const opts = { isCup: true, myStarters: matchStarters(), myOrdered: true, playerTeam: m };
    if (live) startLive(t1, t2, { ...opts, title: `${CUP_NAME} ${G.day.round}` }, finish);
    else finish(runMatch(t1, t2, opts));
  } else finish(null);
}

const teamRows = list => list.map(t => ({ idx: G.teams.indexOf(t), name: t.name, mine: t === me(), p: t.won + t.drawn + t.lost, pts: t.points, w: t.won, d: t.drawn, l: t.lost, gf: t.gf, ga: t.ga }));
const liveStandings = d => teamRows(standings(d));
const keyName = key => leagueName(key.slice(0, 3), Number(key.slice(3)));
function abroadBlock(bg, title = "他リーグの結果") {
  if (!bg || !bg.length) return "";
  return `<section class="card"><h2 class="ch">${title}<small>${bg.length}節分</small></h2>${bg.map(b => `<details class="fold"><summary>${h(countryInfo(b.key.slice(0, 3)).name)}・${h(keyName(b.key))} 第${b.round}節</summary>

function scoreCard(my) {
  const res = my.hs === my.as ? "draw" : (my.hs > my.as) === my.homeMine ? "win" : "lose";
  const label = res === "win" ? "勝利" : res === "lose" ? "敗北" : "引き分け";
  return `<div class="result ${res}">
    <div class="r-label">${h(my.label)}</div>
    <div class="r-row"><span class="${my.homeMine ? "mine" : ""}">${crest(my.home, 40)}${h(my.home)}</span><b>${my.hs} - ${my.as}</b><span class="${!my.homeMine ? "mine" : ""}">${crest(my.away, 40)}${h(my.away)}</span></div>
    <div class="r-verdict">${label}${my.pk ? "（延長・PK）" : ""}</div>
  </div>`;
}

// ---------------- 画面描画 ----------------
function render() {
  if (T.title || !G) { $app.innerHTML = renderTitle(); document.body.classList.add("title-on"); renderSheet(); return; }

    <div class="top-in">
      <div class="club"><button class="crestbtn" data-act="team-view" data-arg="${G.myIdx}" aria-label="クラブ情報">${crest(m.name, 34)}</button><div><b>${h(m.name)}</b><small>${h(leagueName(G.country, m.division))} ${rank}位 · ${m.formation}</small></div></div>
      <div class="meta"><span class="date">${fmtDate(G.date)}</span><span class="money ${m.money < 0 ? "neg" : ""}">${yen(m.money)}</span></div>

      <label class="btn ghost wide filebtn">セーブファイルを読み込む<small>書き出したセーブ・PC版の savegame.json</small><input type="file" id="fileIn" accept=".json,application/json"></label>

      <p class="muted small">${pk.div === 1 ? `1部の上位クラブは${CUP_NAME}に出場できます（出場枠 ${CUP_QUOTA[c.id]}）。` : "2部から昇格を目指します。上位3クラブが1部へ昇格。"}所持金はどのクラブでも ${yen(10000)} から始まります。</p>
      <div class="clubs">${list.map(({ t, i }) => `<button class="club-row ${pk.idx === i ? "on" : ""}" data-act="pick-team" data-arg="${i}">

    </div>

  </div>`;

function renderHome() {
  const d = G.day, m = me();

    const nextMatch = nextFixtureText();
    return `${wk}${offerBlock()}
      <section class="day-hero"><span class="dow">${DOW[weekday(D(G.date))]}</span><div><b>練習日</b><small>練習メニューを選ぶと1日が進みます</small></div></section>
      <section class="card"><h2 class="ch">今日の練習<small>選ぶと1日が進みます</small></h2>

        <div class="grid3 trainbtns">${Object.entries(INTENSITY).map(([k, v]) => `<button class="act ${k === "hard" ? "hot" : ""}" data-act="train" data-arg="${k}"><b>${v.name}</b><small>${v.desc}</small><i class="xpbar"><em style="width:${Math.min(100, v.xp / 1.7 * 100)}%"></em></i></button>`).join("")}</div>
        <div class="grid2">
          <button class="act" data-act="sheet" data-arg="growth"><b>育成方針</b><small>選手ごとに伸ばす能力</small></button>
          <button class="act calm" data-act="rest"><b>休養</b><small>全員 体力+15</small></button>
        </div>
        <div class="grid2">
          <button class="act sm" data-act="sheet" data-arg="intensive"><b>個別特訓</b><small>1人を大幅強化／体力-45</small></button>
          <button class="act sm" data-act="rest-until"><b>試合日まで休養</b><small>まとめて進める</small></button>
        </div>
      </section>
      ${feed}

      <section class="card"><h2 class="ch">クラブ運営<small>日付は進みません</small></h2>
        <div class="grid3">
          <button class="act sm" data-act="sheet" data-arg="formation"><b>戦術</b><small>${m.formation}</small></button>
          <button class="act sm ${m.scout_status === "READY" ? "hot" : ""}" data-act="sheet" data-arg="scout"><b>スカウト</b><small>${sl}</small></button>
          <button class="act sm" data-act="sheet" data-arg="facility"><b>施設</b><small>Lv ${m.facilities.medical}/${m.facilities.training}/${m.facilities.youth}</small></button>
        </div></section>
      ${nextBar("rest", "休養して次の日へ", "", false)}`;
  }
  if (d.phase === "saturday") {
    if (!d.isMatch) return `${wk}<section class="day-hero"><span class="dow">土</span><div><b>試合はありません</b><small>${myLeague().round === 0 ? "リーグ戦開幕まであと少しです。" : leagueDone(myKey()) ? "今季のリーグ戦は全日程を終えました。" : "オフシーズンです。"}</small></div></section>${feed}${abroadBlock(d.bg)}${nextBar("end-day", "日曜日へ")}`;
    if (!d.played) return wk + matchPrep("league") + feed;
    return wk + matchResult("league");
  }

    if (!d.played) return wk + matchPrep("cup") + feed;
    return wk + matchResult("cup");

      <section class="day-hero"><span class="dow">日</span><div><b>休養日</b><small>${d.window ? "移籍市場オープン中（1・7・8月）" : "移籍市場は閉まっています"}</small></div></section>
      ${feed}
      ${d.window ? `<button class="btn wide" data-act="sheet" data-arg="market">移籍リストを見る</button>` : ""}
      ${nextBar("end-week", "新しい一週間へ")}`;

// 戦術の表示（例：4-3-3 · ポゼッション · ライン高い）
const tacText = t => { const c = tacOf(t); return `${t.formation || "4-4-2"} · ${(TAC_STYLE[c.style] || TAC_STYLE.balance).name} · ライン${(TAC_LINE[c.line] || TAC_LINE.mid).name.replace(/（.*）/, "")}`; };

// ---------------- 日程の見える化 ----------------
// その日の自分の予定：league（リーグ戦）/ cup（カップ戦）/ rest（日曜・休養日）/ train（練習日）/ free（試合のない土曜）/ off（オフ）
function dayKind(ds) {
  const d = D(ds), wd = weekday(d), mo = d.getUTCMonth() + 1, st = myLeague();
  if (st && st.dates && st.dates.includes(ds)) return { k: "league", label: `リーグ第${st.dates.indexOf(ds) + 1}節`, icon: "⚽" };
  const cr = cupDates(G.season_year)[ds];
  if (cr && wd === 2 && (ds <= G.date || G.cup_teams.includes(G.myIdx))) return { k: "cup", label: `${CUP_NAME} ${cr}`, icon: "🏆" };
  if (mo === 5 || mo === 6) { if (seasonEndCond()) return { k: "off", label: "オフシーズン", icon: "" }; }
  if (wd === 6) return { k: "rest", label: "休養日", icon: "" };
  if (wd === 5) return { k: "free", label: "試合なし", icon: "" };
  return { k: "train", label: "練習日", icon: "" };
}
function nextMatchInfo() {
  for (let i = 0; i <= 120; i++) {
    const ds = addDays(G.date, i), k = dayKind(ds);
    if (k.k === "league" || k.k === "cup") {
      if (i === 0 && G.day && G.day.played) continue;
      return { ds, days: i, ...k };
    }
  }
  return null;
}
// 今週（月〜日）のカレンダー
function weekStrip() {
  const today = G.date, mon = addDays(today, -weekday(D(today)));
  const cells = Array.from({ length: 7 }, (_, i) => {
    const ds = addDays(mon, i), k = dayKind(ds), d = D(ds);
    const cls = [ds === today ? "today" : ds < today ? "past" : "", k.k].join(" ");
    return `<li class="${cls}"><span class="wd">${DOW[i]}</span><b>${d.getUTCDate()}</b><em>${k.k === "league" ? "試合" : k.k === "cup" ? "杯" : k.k === "rest" ? "休" : k.k === "train" ? "練習" : k.k === "off" ? "オフ" : "—"}</em></li>`;
  }).join("");
  const nm = nextMatchInfo();
  const nmText = nm ? (nm.days === 0 ? `今日は <b>${h(nm.label)}</b>` : `次の試合 <b>${shortDate(nm.ds)} ${h(nm.label)}</b>（あと${nm.days}日）`) : "今季の公式戦はすべて終わりました";
  const d = D(today);
  return `<section class="week"><div class="week-head"><span class="ym">${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月</span><span class="nm">${nmText}</span></div><ol class="week-days">${cells}</ol></section>`;
}
// 画面下に固定する「次へ進む」ボタン。sub に次の日の予定を出す
function nextBar(act, label, arg = "", primary = true) {
  const tm = addDays(G.date, 1), k = dayKind(tm);
  const sub = act === "end-week" ? `${shortDate(tm)} から新しい週` : `${shortDate(tm)} ${k.label}`;
  return `<div class="nextbar"><button class="btn ${primary ? "primary" : ""} wide" data-act="${act}"${arg ? ` data-arg="${arg}"` : ""}>${label}<small>${h(sub)}</small></button></div>`;
}

function nextFixtureText() {
  const st = myLeague();
  const lgDate = st.round < st.schedule.length ? st.dates[st.round] : null;
  const cd = cupDates(G.season_year);
  const cupDate = G.cup_teams.includes(G.myIdx) ? Object.keys(cd).find(ds => ds > G.date) : null;
  const cands = [];
  if (lgDate) cands.push([lgDate, `リーグ第${st.round + 1}節`]);
  if (cupDate) cands.push([cupDate, `${CUP_NAME} ${cd[cupDate]}`]);
  if (!cands.length) return "今季の公式戦は終わりました";
  cands.sort((a, b) => (a[0] < b[0] ? -1 : 1));
  return `次の試合: ${shortDate(cands[0][0])} ${cands[0][1]}`;
}

function offerBlock() {
  const o = G.day.offer;
  if (!o || o.status !== "open") return o && o.msg ? `<section class="card notice">${logList([o.msg])}</section>` : "";
  const m = me(); const p = findOfferPlayer(o); if (!p) return "";
  const team = G.teams[o.teamIdx];
  return `<section class="card offer"><h2 class="ch">🔔 移籍オファーが届きました</h2>
    <p><b>${h(team.name)}</b> があなたのチームの <b>${h(p.name)}</b>（${p.pos}・${p.age}歳・総合${getOvr(p)}）に興味を持っています。</p>
    <div class="offer-price"><span>提示額</span><b>${yen(o.price)}</b><small>市場価値 ${yen(p.value)}</small></div>
    <div class="row2"><button class="btn ghost" data-act="offer" data-arg="no">拒否する</button><button class="btn primary" data-act="offer" data-arg="yes">売却する</button></div>
    <button class="linkbtn" data-act="pdetail-mine" data-arg="${m.roster.indexOf(p)}">選手の詳細を見る</button></section>`;
}
function findOfferPlayer(o) { const r = me().roster; const p = r[o.pIdx]; return p && p.name === o.name ? p : r.find(q => q.name === o.name); }

function matchPrep(kind) {
  const d = G.day, m = me();
  let opp, title, sub;
  if (kind === "league") {
    const list = divTeams(m.division);
    for (const [hi, ai] of myLeague().schedule[myLeague().round]) { if (list[hi] === m) opp = { t: list[ai], home: true }; if (list[ai] === m) opp = { t: list[hi], home: false }; }
    title = `${leagueName(G.country, m.division)} 第${myLeague().round + 1}節`;
  } else {
    title = `${CUP_NAME} ${d.round}`;
    const o = cupOpponent();
    if (o) opp = { t: o, home: G.cup_teams.indexOf(G.myIdx) % 2 === 0 };
  }
  const inMatch = !!opp;
  const tc = myTac();
  const st = `<span class="chip ok">${m.formation} · ${h((TAC_STYLE[tc.style] || TAC_STYLE.balance).name)} · ライン${h((TAC_LINE[tc.line] || TAC_LINE.mid).name.replace(/（.*）/, ""))}</span>`;
  const oppInfo = inMatch ? (() => {
    const t = opp.t, rk = standings(t.division, t.country).indexOf(t) + 1;
    const avg = Math.round(sum(getStarters(t).map(getOvr)) / 11);
    const myAvg = Math.round(sum((matchStarters() || getStarters(m)).map(getOvr)) / 11);
    return `<div class="vs">
      <div class="vs-side mine">${crest(m.name, 40)}<small>${opp.home ? "HOME" : "AWAY"}</small><b>${h(m.name)}</b><span>先発平均 ${myAvg}</span></div>
      <div class="vs-x">VS</div>
      <div class="vs-side">${crest(t.name, 40)}<small>${opp.home ? "AWAY" : "HOME"}</small><b>${h(t.name)}</b><span>${h(teamLeagueName(t))} ${rk}位 · 平均 ${avg}</span></div></div>
      <p class="opp-tac"><span>相手の戦術</span><b>${tacText(t)}</b></p>
      ${!opp.home ? `<p class="muted small">アウェイでは攻撃の成功率が下がります。</p>` : ""}`;
  })() : `<p>あなたのチームはすでに敗退しています。</p>`;
  const bracket = kind === "cup" ? cupBracketBlock() : "";
  return `<section class="day-hero match"><span class="dow">${kind === "cup" ? "杯" : DOW[weekday(D(G.date))]}</span><div><b>${title}</b><small>${kind === "cup" ? `残り${G.cup_teams.length}チーム` : "試合当日"}</small></div></section>
    <section class="card">${oppInfo}
      ${inMatch ? `<div class="chips">${st}</div>
      <button class="btn primary wide big" data-act="${kind === "cup" ? "cup-play" : "league-play"}" data-arg="live">試合開始（実況）</button>
      <div class="grid3">
        <button class="act sm" data-act="tab" data-arg="tactics"><b>戦術</b><small>先発・作戦</small></button>
        <button class="act sm" data-act="sheet" data-arg="opp"><b>相手名簿</b><small>${h(opp.t.name)}</small></button>
        <button class="act sm" data-act="${kind === "cup" ? "cup-play" : "league-play"}" data-arg="quick"><b>スキップ</b><small>結果だけ見る</small></button>
      </div>` : `<button class="btn primary wide" data-act="cup-play" data-arg="quick">試合結果を見る</button>`}
    </section>${bracket}`;
}

function cupBracketBlock() {
  const ct = G.cup_teams; const rows = [];
  for (let i = 0; i < ct.length; i += 2) {
    const t1 = G.teams[ct[i]];
    if (i + 1 < ct.length) { const t2 = G.teams[ct[i + 1]]; const mine = ct[i] === G.myIdx || ct[i + 1] === G.myIdx; rows.push(`<li class="${mine ? "mine" : ""}"><span>${h(t1.name)}<em class="cc">${t1.country}</em></span><i>vs</i><span>${h(t2.name)}<em class="cc">${t2.country}</em></span></li>`); }
    else rows.push(`<li><span>${h(t1.name)}</span><i>不戦勝</i><span></span></li>`);
  }
  return `<section class="card"><h2 class="ch">対戦表</h2><ol class="bracket">${rows.join("")}</ol></section>`;
}

function matchResult(kind) {
  const d = G.day;
  const my = d.my ? scoreCard(d.my) + `<section class="card">${logList(d.my.logs)}${kind === "cup" ? `<p>${d.my.won ? "🎉 勝利！ 次のラウンドへの進出を決めました！" : `😱 敗北… ${CUP_NAME}から敗退しました。`}</p>` : ""}</section>` : "";
  let list = "";
  if (kind === "league") {
    list = `<section class="card"><h2 class="ch">${h(d.my.label)} 試合結果</h2><ul class="scores">${d.results.map(r => `<li class="${r.mine ? "mine" : ""}"><span>${h(r.home)}</span><b>${r.hs} - ${r.as}</b><span>${h(r.away)}</span></li>`).join("")}</ul></section>
      <section class="card"><h2 class="ch">${h(leagueName(G.country, me().division))} 順位表</h2>${standingsTable(liveStandings(me().division))}</section>
      ${abroadBlock(d.bg)}
      ${nextBar("end-day", weekday(D(G.date)) === 5 ? "日曜日へ" : "次の日へ")}`;
  } else {
    list = `<section class="card"><h2 class="ch">${h(d.round)} 全試合結果</h2><ul class="scores">${d.results.map(r => r.bye ? `<li><span>${h(r.bye)}</span><b>不戦勝</b><span></span></li>` : `<li class="${r.mine ? "mine" : ""}"><span>${h(r.home)}</span><b>${r.hs} - ${r.as}${r.pk ? "<sup>PK</sup>" : ""}</b><span>${h(r.away)}</span></li>`).join("")}</ul></section>`;
    if (d.final) {
      const f = d.final;
      list += `<section class="card trophy"><h2 class="ch">🏆 ${CUP_NAME} 優勝：${h(f.winner)}</h2><p>大会主催者より優勝賞金 ${yen(30000)} が授与されました。${f.mine ? `<br><b>おめでとうございます！ 所持金が ${yen(me().money)} になりました。</b>` : ""}</p>
        <h3 class="sh">${CUP_NAME} 得点王</h3>${scorerList(f.scorers)}${f.award ? `<p class="small">得点王 ${h(f.award.name)}（${h(f.award.team)}）のチームに特別ボーナス ${yen(f.award.bonus)}</p>` : ""}</section>`;
    } else list += cupBracketBlock().replace("対戦表", "次のラウンド");
    list += nextBar("end-day", "次の日へ");
  }
  return `<section class="day-hero match"><span class="dow">${kind === "cup" ? "杯" : DOW[weekday(D(G.date))]}</span><div><b>試合終了</b><small>${h(d.my ? d.my.label : CUP_NAME + " " + d.round)}</small></div></section>${my}${list}`;
}

// 育成方針の一覧の1行：方針・成長ゲージ・次に伸びる能力
function growthRow(p) {
  const m = me(), f = FOCUS[p.focus] || FOCUS.auto;
  const nx = p.legend ? null : nextFocusSkill(p), xp = Math.round(p.txp || 0);
  const note = p.legend ? "レジェンド（全盛期の姿へ成長）" : p.injury_days ? `負傷中（${p.injury_days}日）` : nx ? `次は ${SKJ[nx]}（${p[nx]}）` : "重点能力は上限まで伸びた";
  return `<button class="grow" data-act="focus-pick" data-arg="${m.roster.indexOf(p)}">
    <span class="pos pos-${p.pos}">${p.pos}</span>
    <span class="gmain"><b>${h(p.name)}</b><small>${p.age}歳 · ${note}</small><i class="gbar"><em style="width:${p.legend || !nx ? 0 : Math.min(100, xp)}%"></em></i></span>
    <span class="gfocus">${p.legend ? "—" : f.name}<small>変更 ›</small></span></button>`;
}
// 移籍リストの1行：名前は1行で、所属・年齢・国籍は2行目、価格は右にまとめる
function marketRow(it, i, money) {
  const p = it.player, ovr = getOvr(p), ok = money >= p.value;
  const team = it.fromIdx != null ? `${crest(G.teams[it.fromIdx].name, 14)}<span>${h(G.teams[it.fromIdx].name)}</span>` : `<span class="fa">無所属</span>`;
  return `<button class="mrow" data-act="mk-view" data-arg="${i}">
    <span class="pos pos-${p.pos}">${p.pos}</span>
    <span class="mmain">
      <b class="mname">${p.legend ? "🌟 " : ""}${h(p.name)}</b>
      <span class="mteam">${team}</span>
      <span class="mmeta">${p.age}歳 · ${p.height ? `${p.height}cm · ` : ""}${h(natName(p))}</span>
    </span>
    <span class="mstat"><b class="${ovrClass(ovr)}">${ovr}</b><small>総合</small><span class="ppot ${potClass(p.potential)}">${potRank(p.potential)}</span></span>
    <span class="mprice ${ok ? "ok" : "ng"}"><b>${Number(p.value).toLocaleString("ja-JP")}<small>円</small></b><em>${ok ? "予算内" : `あと${(p.value - money).toLocaleString("ja-JP")}`}</em></span>
  </button>`;
}
// 移籍リストの価格欄：金額（円）と、今の所持金で買えるか
function priceCell(v, money) {
  const ok = money >= v;
  return `<span class="price ${ok ? "ok" : "ng"}"><b>${Number(v).toLocaleString("ja-JP")}<small>円</small></b><em>${ok ? "予算内" : `あと${Math.max(0, v - money).toLocaleString("ja-JP")}`}</em></span>`;
}
function scorerList(rows, unit = "点") {
  if (!rows.length) return `<p class="muted">（記録なし）</p>`;
  return `<ol class="scorers">${rows.map((r, i) => `<li class="${r.mine ? "mine" : ""} ${i === 0 ? "first" : ""}"><span class="rk">${i + 1}</span><span class="nm">${h(r.name)}<small>${h(r.team)}</small></span><b>${r.goals}<small>${unit}</small></b></li>`).join("")}</ol>`;
}

    <section class="card"><h2 class="ch">${h(c.l2)} 最終結果</h2>${standingsTable(c.d2)}<p>${h(c.l2)}優勝: <b>${h(c.champ2)}</b> 🎊</p></section>${nav(`${c.l1}の結果へ`)}`;

function renderTable() {
  const m = me();
  const key = T.standDiv || G.country + m.division;
  const segs = [...COUNTRIES.flatMap(c => [1, 2].map(d => [c.id + d, c.leagues[d - 1]])), ["cup", CUP_NAME]];
  let inner;
  if (key === "cup") {
    const cd = cupDates(G.season_year);
    const sched = Object.entries(cd).map(([ds, n]) => `<li class="${ds < G.date ? "past" : ""}"><span>${shortDate(ds)}</span><b>${n}</b></li>`).join("");
    inner = `<p class="muted small">5大リーグの上位32クラブによるノックアウト方式。</p><ul class="cupdates">${sched}</ul>${G.cup_teams.length > 1 ? cupBracketBlock() : `<p>今季の${CUP_NAME}は終了しました。優勝: <b>${h(G.teams[G.cup_teams[0]].name)}</b></p>`}`;
  } else {
    const cid = key.slice(0, 3), d = Number(key.slice(3));
    const played = G.lg[key].round, total = G.lg[key].schedule.length;
    inner = `<h2 class="ch">${h(leagueName(cid, d))}<small>${h(countryInfo(cid).name)} · 第${played}節終了（全${total}節）</small></h2>` +
      standingsTable(teamRows(standings(d, cid))) +
      `<p class="muted small">${d === 1 ? `下位3クラブが降格。上位${CUP_QUOTA[cid]}クラブが来季の${CUP_NAME}へ。` : "上位3クラブが昇格。"}チーム名をタップすると名簿を見られます。</p>`;
  }
  return `<section class="card"><div class="chiprow">${segs.map(([k, l]) => `<button class="${key === k ? "on" : ""}" data-act="stand-div" data-arg="${k}">${h(l)}</button>`).join("")}</div>${inner}</section>`;
}

function renderGoals() {
  const view = T.recView || "now";
  const top = `<div class="seg wide">${[["now", "今季の記録"], ["hist", "歴代シーズン"]].map(([k, l]) => `<button class="${view === k ? "on" : ""}" data-act="rec-view" data-arg="${k}">${l}</button>`).join("")}</div>`;
  return `<section class="card">${top}${view === "hist" ? renderHistory() : renderNow()}</section>`;
}
function statSeg() {
  const st = T.statKind || "goals";
  return `<div class="seg">${[["goals", "得点"], ["assists", "アシスト"]].map(([k, l]) => `<button class="${st === k ? "on" : ""}" data-act="stat-kind" data-arg="${k}">${l}</button>`).join("")}</div>`;
}
function renderNow() {
  const mode = T.scorerMode || G.country + me().division;
  const modes = [...COUNTRIES.flatMap(c => [1, 2].map(d => [c.id + d, c.leagues[d - 1]])), ["cup", CUP_NAME], ["news", "移籍ニュース"]];
  const chips = `<div class="chiprow">${modes.map(([k, l]) => `<button class="${mode === k ? "on" : ""}" data-act="scorer-mode" data-arg="${k}">${h(l)}</button>`).join("")}</div>`;
  if (mode === "news") {
    const news = G.news || [];
    return chips + `<h2 class="ch">移籍ニュース<small>移籍期間（1・7・8月）の日曜日に成立</small></h2>` + (news.length ? `<ul class="news">${news.slice(0, 150).map(n => `<li><span class="nd">${shortDate(n.date)}</span><div><b>${n.legend ? "🌟 " : ""}${h(n.name)}</b><small>${n.pos}・${n.age}歳・総合${n.ovr}</small><span>${h(n.from)} → ${h(n.to)}</span></div><em>${yen(n.fee)}</em></li>`).join("")}</ul>` : `<p class="muted">まだ移籍は成立していません。移籍期間の日曜日にクラブ同士の移籍が発生します。</p>`);
  }
  const st = T.statKind || "goals";
  const title = mode === "cup" ? CUP_NAME : leagueName(mode.slice(0, 3), Number(mode.slice(3)));
  return chips + `<div class="ch-row"><h2 class="ch">${st === "goals" ? "得点" : "アシスト"}ランキング<small>${h(title)}</small></h2>${statSeg()}</div>${scorerList(topScorers(mode, 10, st), st === "goals" ? "点" : "A")}`;
}
function renderHistory() {
  const hist = G.history || [];
  if (!hist.length) return `<div class="empty"><b>まだ終わったシーズンがありません</b><p class="muted small">シーズンが終わると、全リーグの最終順位表・得点王・アシスト王と、あなたのクラブの成績がここに残ります。</p></div>`;
  const idx = Math.min(T.histIdx ?? hist.length - 1, hist.length - 1);
  const rec = hist[idx];
  const seasons = `<div class="chiprow">${hist.map((r, i) => [r, i]).reverse().map(([r, i]) => `<button class="${i === idx ? "on" : ""}" data-act="hist-season" data-arg="${i}">${r.year}/${String(r.year + 1).slice(2)}</button>`).join("")}</div>`;
  const kn = k => leagueName(k.slice(0, 3), Number(k.slice(3)));
  const m = rec.my;
  const myCard = `<div class="hist-me">${crest(rec.club, 44)}<div><b>${h(rec.club)}</b><span>${h(kn(m.key))} <em>${m.rank}位</em> / ${m.n}クラブ</span>
    <small>${m.w}勝${m.d}分${m.l}敗 · 勝点${m.pts} · ${m.gf}得点${m.ga}失点 · ${CUP_NAME}: ${h(m.cup)}</small>
    ${m.topGoals || m.topAssists ? `<small>チーム得点王 ${m.topGoals ? `${h(m.topGoals[0])} ${m.topGoals[1]}点` : "—"} · アシスト ${m.topAssists ? `${h(m.topAssists[0])} ${m.topAssists[1]}` : "—"}</small>` : ""}</div></div>`;
  const champs = `<h3 class="sh">各リーグの優勝</h3><ul class="hist-champs">${leagueKeys().map(k => { const t = rec.leagues[k] && rec.leagues[k].table[0]; return t ? `<li><span>${h(kn(k))}</span><b>${crest(t[0], 18)}${h(t[0])}</b></li>` : ""; }).join("")}
    ${rec.cup && rec.cup.winner ? `<li class="cupw"><span>${CUP_NAME}</span><b>${crest(rec.cup.winner, 18)}${h(rec.cup.winner)}</b></li>` : ""}</ul>`;
  const key = T.histKey || m.key;
  const keyChips = `<div class="chiprow">${[...leagueKeys().map(k => [k, kn(k)]), ["cup", CUP_NAME]].map(([k, l]) => `<button class="${key === k ? "on" : ""}" data-act="hist-key" data-arg="${k}">${h(l)}</button>`).join("")}</div>`;
  const st = T.statKind || "goals";
  const L = key === "cup" ? rec.cup : rec.leagues[key];
  const rows = (L ? L[st] : []).map(([n, t, g]) => ({ name: n, team: t, goals: g, mine: t === rec.club }));
  const table = key !== "cup" && L ? standingsTable(L.table.map(([n, w, d, l, gf, ga, pts]) => ({ name: n, mine: n === rec.club, p: w + d + l, pts, w, d, l, gf, ga }))) : "";
  return seasons + myCard + champs + `<h3 class="sh">リーグ別の記録</h3>` + keyChips +
    (table ? `<details class="fold" open><summary>最終順位表</summary>${table}</details>` : "") +
    `<div class="ch-row"><h3 class="sh">${st === "goals" ? "得点王" : "アシスト王"}</h3>${statSeg()}</div>${scorerList(rows, st === "goals" ? "点" : "A")}`;
}

// ---------------- シート（下から出るパネル） ----------------
function openSheet(s) { T.sheets.push(s); renderSheet(); }
function closeSheet(all) { if (all) T.sheets = []; else T.sheets.pop(); renderSheet(); render(); }
function renderSheet() {
  const s = T.sheets[T.sheets.length - 1];
  if (!s) { $sheet.hidden = true; $sheet.innerHTML = ""; delete $sheet.dataset.key; T.sheetScroll = {}; document.body.classList.remove("sheet-on"); return; }
  document.body.classList.add("sheet-on");
  $sheet.hidden = false;
  const content = SHEETS[s.kind](s);
  // 前のシートのスクロール位置を覚えておき、同じシートに戻ったときに戻す
  const prevBody = $sheet.querySelector(".panel-body"), prevKey = $sheet.dataset.key;
  if (prevBody && prevKey) T.sheetScroll = Object.assign(T.sheetScroll || {}, { [prevKey]: prevBody.scrollTop });
  const key = `${T.sheets.length}:${s.kind}`, same = prevKey === key || (T.sheetScroll && T.sheetScroll[key] != null && prevKey && prevKey !== key);
  $sheet.dataset.key = key;
  $sheet.innerHTML = `<div class="scrim" data-act="sheet-close"></div><div class="panel${same ? " re" : ""}" role="dialog" aria-modal="true">
    <div class="panel-head"><button class="iconbtn" data-act="sheet-close" aria-label="戻る">${T.sheets.length > 1 ? "‹" : "×"}</button><h2>${content.title}</h2></div>
    <div class="panel-body">${content.body}</div></div>`;
  const nb = $sheet.querySelector(".panel-body");
  if (nb && T.sheetScroll && T.sheetScroll[key] != null && same) nb.scrollTop = T.sheetScroll[key];
}

const SHEETS = {
  player(s) {
    const p = s.p, ovr = getOvr(p);
    const bars = (label, list) => `<h3 class="sh">${label}</h3><div class="bars">${list.map(k => `<div class="bar"><span>${SKJ[k]}</span><i><em class="${tierClass(p[k])}" style="width:${Math.min(100, p[k])}%"></em></i><b class="${tierClass(p[k])}">${p[k]}</b></div>`).join("")}</div>`;
    let actions = "";
    if (s.mode === "mine") {
      const cnt = active(me()).length;

      else actions = cnt <= 15 ? `<p class="muted small">選手数が少なすぎるため、これ以上解雇できません（15人以下）。</p>` : `<button class="btn ghost wide dangertxt" data-act="rel-ask">この選手を解雇する</button>`;

                                  : `<button class="btn primary wide" data-act="buy-ask">${yen(p.value)} で獲得する</button>`;

      title: h(p.name),
      body: `<div class="pd-top"><span class="pos pos-${p.pos} lg">${p.pos}</span>

        ${p.legend ? `<div class="legendbox"><b>🌟 レジェンド</b><span>${p.age <= 22 && getOvr(p) < (LEGEND_BY_ID[p.legend] || [])[6] - 3 ? `のちの伝説となる若き才能。ふつうの選手より速く成長し、25歳ごろまでに全盛期（総合${(LEGEND_BY_ID[p.legend] || [])[6]}前後）の姿へ近づきます。` : "往年の名選手が全盛期の姿で登場。年齢とともに能力は少しずつ落ちていきます。"}</span></div>` : ""}
        ${p.skill ? `<div class="skillbox ${p.is_rare ? "rare" : ""}"><b>【${h(p.skill)}】</b><span>${h(PLAYER_SKILLS[p.skill] || "")}</span></div>` : ""}
        <dl class="kv">${p.nat ? `<dt>国籍</dt><dd>${h(natName(p))}</dd>` : ""}<dt>市場価値</dt><dd>${yen(p.value)}</dd><dt>将来性</dt><dd class="${potClass(p.potential)}">${potLabel(p.potential)}</dd>

  formation() {

        <p>体力 -45・疲労 +25 と引き換えに、1〜3項目の能力が1〜3ずつ上がります。スキル未所持なら5%で覚醒。3%でオーバーワークによる負傷のリスクがあります。</p>

    return { title: `${h(p.name)} の育成方針`, body: `<div class="flist">${opts.map(([k, v]) => {
      const sk = k === "auto" ? (AUTO_FOCUS[p.pos] || []) : v.skills;
      return `<button class="focusopt ${(p.focus || "auto") === k ? "on" : ""}" data-act="set-focus" data-arg="${k}"><b>${v.name}</b><small>${sk.map(x => `${SKJ[x]} ${p[x]}`).join(" · ")}</small></button>`; }).join("")}</div>` };

  scout(s) {
    const m = me();
    if (m.scout_status === "SEARCHING") return { title: "ユーススカウト", body: `<p>現在スカウトが各地を飛び回っています。報告まであと <b>${m.scout_timer}</b> 日です。${m.scout_target_pos ? `（ターゲット: ${m.scout_target_pos}）` : ""}</p>` };
    if (m.scout_status === "READY") {
      return { title: "スカウト報告：発掘された逸材", body: `<p class="muted small">1人だけ獲得できます。獲得すると報告は終了します。</p>${rowHead()}<div class="plist">${m.scout_candidates.map((p, i) => playerRow(p, { act: "scout-view", idx: i })).join("")}</div>
        <div class="row2"><button class="btn ghost" data-act="sheet-close">保持して戻る</button><button class="btn ghost dangertxt" data-act="scout-discard">報告を破棄する</button></div>` };

    return { title: "ユーススカウト派遣", body: `
      <div class="grid2">
        <button class="act ${sel === "1" ? "on" : ""}" data-act="scout-dest" data-arg="1"><b>国内調査</b><small>1,000円 · 3日間 · 期待度:中</small></button>

      </div>

      ${m.scout_boost ? `<p class="rare small">噂の逸材の情報があります。次の調査で有望な選手が見つかりやすくなります。</p>` : ""}` };

    const rows = [["medical", "メディカルセンター", "怪我減少・回復UP"], ["training", "トレーニングジム", "特訓効率UP"], ["youth", "ユースアカデミー", "スカウトの才能UP"]];
    return { title: "クラブ施設投資", body: `<p>予算: <b class="${m.money < 0 ? "bad" : ""}">${yen(m.money)}</b></p>
      ${rows.map(([k, n, d]) => { const lv = f[k], cost = lv * 10000; const conf = s.confirm === k;
        return `<div class="fac"><div><b>${n}</b><small>${d}</small><span class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= lv ? "on" : ""}"></i>`).join("")} Lv.${lv}</span></div>
          ${lv >= 5 ? `<span class="chip">最大</span>` : conf ? `<div class="row2"><button class="btn ghost sm" data-act="fac-cancel">やめる</button><button class="btn primary sm" data-act="fac-go" data-arg="${k}">${yen(cost)}で強化</button></div>`
          : `<button class="btn sm" data-act="fac-ask" data-arg="${k}" ${m.money < cost ? "disabled" : ""}>Lv.${lv + 1}へ<small>${yen(cost)}</small></button>`}</div>`; }).join("")}` };
  },
  market(s) {
    const m = me();
    if (!T.market || T.marketDate !== G.date) buildMarket();
    const msg = s.msg ? logList([s.msg]) : "";
    return { title: "移籍市場：本日のリスト", body: `<p>現在の所持金: <b class="${m.money < 0 ? "bad" : ""}">${yen(m.money)}</b> · 登録 ${m.roster.length}/${MAX_ROSTER}</p>${msg}
      <div class="mlist">${T.market.map((it, i) => marketRow(it, i, m.money)).join("")}</div>
      ${!T.market.length ? `<p class="muted">リストに残っている選手はいません。</p>` : ""}` };
  },
};

function currentOpp() {
  const d = G.day, m = me();
  if (d.phase === "cup") return cupOpponent();
  if (d.phase === "saturday" && d.isMatch) { const list = divTeams(m.division), st = myLeague(); for (const [hi, ai] of st.schedule[st.round]) { if (list[hi] === m) return list[ai]; if (list[ai] === m) return list[hi]; } }
  return null;
}

function buildMarket() {
  const list = [];
  const fixed = DATA.FIXED_PLAYERS || [];
  if (fixed.length && rnd() < 0.05) list.push({ player: createPlayer({ fixed: choice(fixed) }), fromIdx: null });
  const tmp = [];
  G.teams.forEach((t, i) => { if (i === G.myIdx) return; if (t.roster.length > 18) tmp.push({ player: choice(t.roster), fromIdx: i }); });
  shuffle(tmp);
  list.push(...tmp.slice(0, 5));
  for (let i = 0; i < 5; i++) list.push({ player: createPlayer({ quality: "scout_high" }), fromIdx: null });
  shuffle(list);
  const lm = legendState().market;
  if (lm) list.unshift({ player: createLegend(lm.id), fromIdx: null, legend: true });   // 争奪中のレジェンドは先頭に
  T.market = list.slice(0, 8); T.marketDate = G.date;
}

  "lv-back"(x) { LiveMatch.action("lv-back", x); },

  "focus-pick"(i) { const p = me().roster[Number(i)]; if (p.legend) { toast("レジェンドは育成方針を変えられません"); return; } openSheet({ kind: "focus", p }); },
  "set-focus"(k) { const s = topSheet(); s.p.focus = k === "auto" ? null : k; persist(); closeSheet(); toast(`${s.p.name} の育成方針：${FOCUS[k].name}`); },
