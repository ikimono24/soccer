function matchPrep(kind) {
  const d = G.day, m = me();
  let opp, title, sub;
  if (kind === "league") {
    const list = divTeams(m.division);
    for (const [hi, ai] of myLeague().schedule[myLeague().round]) { if (list[hi] === m) opp = { t: list[ai], home: true }; if (list[ai] === m) opp = { t: list[hi], home: false }; }
    title = `${leagueName(G.country, m.division)} 第${myLeague().round + 1}節`;
  } else {
    title = `${CUP_NAME} ${d.round}`;
    const o = cupOpponent();
    if (o) opp = { t: o, home: G.cup_teams.indexOf(G.myIdx) % 2 === 0 };
  }
  const inMatch = !!opp;
  const st = T.starters ? `<span class="chip ok">スタメン選出済み</span>` : `<span class="chip">スタメン: おまかせ</span>`;
  const oppInfo = inMatch ? (() => {
    const t = opp.t, rk = standings(t.division, t.country).indexOf(t) + 1;
    const avg = Math.round(sum(getStarters(t).map(getOvr)) / 11);
    const myAvg = Math.round(sum((T.starters || getStarters(m)).map(getOvr)) / 11);
    return `<div class="vs">
      <div class="vs-side mine">${crest(m.name, 40)}<small>${opp.home ? "HOME" : "AWAY"}</small><b>${h(m.name)}</b><span>先発平均 ${myAvg}</span></div>
      <div class="vs-x">VS</div>
      <div class="vs-side">${crest(t.name, 40)}<small>${opp.home ? "AWAY" : "HOME"}</small><b>${h(t.name)}</b><span>${h(teamLeagueName(t))} ${rk}位 · 平均 ${avg}</span></div></div>
      ${!opp.home ? `<p class="muted small">アウェイでは攻撃の成功率が下がります。</p>` : ""}`;
  })() : `<p>あなたのチームはすでに敗退しています。</p>`;
  const bracket = kind === "cup" ? cupBracketBlock() : "";
  return `<section class="day-hero match"><span class="dow">${kind === "cup" ? "杯" : DOW[weekday(D(G.date))]}</span><div><b>${title}</b><small>${kind === "cup" ? `残り${G.cup_teams.length}チーム` : "試合当日"}</small></div></section>
    <section class="card">${oppInfo}
      ${inMatch ? `<div class="chips">${st}</div>
      <button class="btn primary wide big" data-act="${kind === "cup" ? "cup-play" : "league-play"}" data-arg="live">試合開始（実況）</button>
      <div class="grid3">
        <button class="act sm" data-act="sheet" data-arg="starters"><b>スタメン</b><small>手動で選ぶ</small></button>
        <button class="act sm" data-act="sheet" data-arg="opp"><b>相手名簿</b><small>${h(opp.t.name)}</small></button>
        <button class="act sm" data-act="${kind === "cup" ? "cup-play" : "league-play"}" data-arg="quick"><b>スキップ</b><small>結果だけ見る</small></button>
      </div>` : `<button class="btn primary wide" data-act="cup-play" data-arg="quick">試合結果を見る</button>`}
    </section>${bracket}`;
}

function cupBracketBlock() {
  const ct = G.cup_teams; const rows = [];
  for (let i = 0; i < ct.length; i += 2) {
    const t1 = G.teams[ct[i]];
    if (i + 1 < ct.length) { const t2 = G.teams[ct[i + 1]]; const mine = ct[i] === G.myIdx || ct[i + 1] === G.myIdx; rows.push(`<li class="${mine ? "mine" : ""}"><span>${h(t1.name)}<em class="cc">${t1.country}</em></span><i>vs</i><span>${h(t2.name)}<em class="cc">${t2.country}</em></span></li>`); }
    else rows.push(`<li><span>${h(t1.name)}</span><i>不戦勝</i><span></span></li>`);
  }
  return `<section class="card"><h2 class="ch">対戦表</h2><ol class="bracket">${rows.join("")}</ol></section>`;
}

function matchResult(kind) {
  const d = G.day;
  const my = d.my ? scoreCard(d.my) + `<section class="card">${logList(d.my.logs)}${kind === "cup" ? `<p>${d.my.won ? "🎉 勝利！ 次のラウンドへの進出を決めました！" : `😱 敗北… ${CUP_NAME}から敗退しました。`}</p>` : ""}</section>` : "";
  let list = "";
  if (kind === "league") {
    list = `<section class="card"><h2 class="ch">${h(d.my.label)} 試合結果</h2><ul class="scores">${d.results.map(r => `<li class="${r.mine ? "mine" : ""}"><span>${h(r.home)}</span><b>${r.hs} - ${r.as}</b><span>${h(r.away)}</span></li>`).join("")}</ul></section>
      <section class="card"><h2 class="ch">${h(leagueName(G.country, me().division))} 順位表</h2>${standingsTable(liveStandings(me().division))}</section>
      ${abroadBlock(d.bg)}
      <button class="btn primary wide" data-act="end-day">${weekday(D(G.date)) === 5 ? "日曜日へ" : "次の日へ"}</button>`;
  } else {
    list = `<section class="card"><h2 class="ch">${h(d.round)} 全試合結果</h2><ul class="scores">${d.results.map(r => r.bye ? `<li><span>${h(r.bye)}</span><b>不戦勝</b><span></span></li>` : `<li class="${r.mine ? "mine" : ""}"><span>${h(r.home)}</span><b>${r.hs} - ${r.as}${r.pk ? "<sup>PK</sup>" : ""}</b><span>${h(r.away)}</span></li>`).join("")}</ul></section>`;
    if (d.final) {
      const f = d.final;
      list += `<section class="card trophy"><h2 class="ch">🏆 ${CUP_NAME} 優勝：${h(f.winner)}</h2><p>大会主催者より優勝賞金 ${yen(30000)} が授与されました。${f.mine ? `<br><b>おめでとうございます！ 所持金が ${yen(me().money)} になりました。</b>` : ""}</p>
        <h3 class="sh">${CUP_NAME} 得点王</h3>${scorerList(f.scorers)}${f.award ? `<p class="small">得点王 ${h(f.award.name)}（${h(f.award.team)}）のチームに特別ボーナス ${yen(f.award.bonus)}</p>` : ""}</section>`;
    } else list += cupBracketBlock().replace("対戦表", "次のラウンド");
    list += `<button class="btn primary wide" data-act="end-day">次の日へ</button>`;
  }
  return `<section class="day-hero match"><span class="dow">${kind === "cup" ? "杯" : DOW[weekday(D(G.date))]}</span><div><b>試合終了</b><small>${h(d.my ? d.my.label : CUP_NAME + " " + d.round)}</small></div></section>${my}${list}`;
}

// 移籍リストの価格欄：金額（円）と、今の所持金で買えるか
function priceCell(v, money) {
  const ok = money >= v;
  return `<span class="price ${ok ? "ok" : "ng"}"><b>${Number(v).toLocaleString("ja-JP")}<small>円</small></b><em>${ok ? "予算内" : `あと${Math.max(0, v - money).toLocaleString("ja-JP")}`}</em></span>`;
}
function scorerList(rows, unit = "点") {
  if (!rows.length) return `<p class="muted">（記録なし）</p>`;
  return `<ol class="scorers">${rows.map((r, i) => `<li class="${r.mine ? "mine" : ""} ${i === 0 ? "first" : ""}"><span class="rk">${i + 1}</span><span class="nm">${h(r.name)}<small>${h(r.team)}</small></span><b>${r.goals}<small>${unit}</small></b></li>`).join("")}</ol>`;
}

function renderSeasonEnd() {
  const d = G.day, c = d.cer, step = d.step;
  const nav = (label) => `<button class="btn primary wide" data-act="cer-next">${label}</button>`;
  if (step === 0) return `<section class="day-hero trophy"><span class="dow">終</span><div><b>シーズン全日程 終了</b><small>最終順位の発表</small></div></section>
    <section class="card"><h2 class="ch">${h(c.l2)} 最終結果</h2>${standingsTable(c.d2)}<p>${h(c.l2)}優勝: <b>${h(c.champ2)}</b> 🎊</p></section>${nav(`${c.l1}の結果へ`)}`;
  if (step === 1) return `<section class="card"><h2 class="ch">${h(c.l1)} 最終結果</h2>${standingsTable(c.d1)}<p>${h(c.l1)}優勝: <b>${h(c.champ1)}</b> 🏆</p></section>${nav("あなたの成績へ")}`;
  if (step === 2) return `<section class="card final-me"><h2 class="ch">あなたのシーズン成績</h2>
      <dl class="kv"><dt>所属リーグ</dt><dd>${h(c.my.div === 1 ? c.l1 : c.l2)}</dd><dt>最終順位</dt><dd><b>${c.my.rank}位</b></dd><dt>獲得賞金</dt><dd class="good">+${yen(c.my.amt)}</dd><dt>所持金</dt><dd>${yen(c.moneyAfterPrize)}</dd></dl></section>${nav("昇格・降格の発表へ")}`;
  if (step === 3) return `<section class="card"><h2 class="ch">📢 昇格・降格チームの発表</h2>
      <h3 class="sh bad">降格（${h(c.l1)}→${h(c.l2)}）</h3><ul class="updown">${c.relegated.map(t => `<li class="${t.mine ? "mine" : ""}">↓ ${h(t.name)}</li>`).join("")}</ul>
      <h3 class="sh good">昇格（${h(c.l2)}→${h(c.l1)}）</h3><ul class="updown">${c.promoted.map(t => `<li class="${t.mine ? "mine" : ""}">↑ ${h(t.name)}</li>`).join("")}</ul></section>${nav("得点王の発表へ")}`;
  if (step === 4) return `<section class="card trophy"><h2 class="ch">🏆 リーグ戦得点王<small>${h(c.l1)}・${h(c.l2)}</small></h2>${scorerList(c.scorers)}
      ${c.assists && c.assists.length ? `<h3 class="sh">アシスト王</h3>${scorerList(c.assists.slice(0, 5), "A")}` : ""}
      ${c.scorerAward ? `<p>🎊 得点王：<b>${h(c.scorerAward.name)}</b>（${h(c.scorerAward.team)}）<br>チームに特別ボーナス ${yen(c.scorerAward.bonus)} が授与されました！</p>` : ""}</section>${nav("他国リーグの結果へ")}`;
  if (step === 5) return `<section class="card"><h2 class="ch">🌍 他国リーグ 最終結果</h2>
      <ul class="champs">${c.abroad.map(a => `<li><small>${h(a.name)}</small><b>🏆 ${h(a.champ1)}</b><span>${h(a.l2)}優勝 ${h(a.champ2)}</span>
        <span>昇格: ${a.promoted.map(t => h(t.name)).join("、")}</span><span>降格: ${a.relegated.map(t => h(t.name)).join("、")}</span>
        ${a.scorer ? `<span>得点王 ${h(a.scorer.name)}（${h(a.scorer.team)}）${a.scorer.goals}点</span>` : ""}</li>`).join("")}</ul></section>
      ${c.abroad.map(a => `<details class="card fold"><summary>${h(a.l1)} 最終順位表</summary>${standingsTable(a.d1, false)}</details>`).join("")}${nav(`来季の${CUP_NAME}へ`)}`;
  if (step === 6) return `<section class="card trophy"><h2 class="ch">来季の${CUP_NAME} 出場クラブ</h2>
      <p>${c.myCup ? `<b class="good">おめでとうございます！ 来季の${CUP_NAME}出場権を獲得しました。</b>` : `来季の${CUP_NAME}出場権は獲得できませんでした。`}</p>
      ${COUNTRIES.map(x => `<h3 class="sh">${h(x.name)}（${CUP_QUOTA[x.id]}）</h3><p class="cuplist">${c.nextCup.filter(t => t.country === x.id).map(t => `<span class="${t.mine ? "mine" : ""}">${h(t.name)}</span>`).join("")}</p>`).join("")}
    </section>${nav("次へ")}`;
  return `<section class="day-hero"><span class="dow">休</span><div><b>オフシーズン</b><small>今シーズンの全日程が終了しました</small></div></section>
    ${d.logs.length ? `<section class="card">${logList(d.logs)}</section>` : ""}
    <section class="card"><p>5月・6月はオフシーズンです。来シーズンの準備（7月1日）までスキップしますか？</p>
    <p class="muted small">スキップすると全選手の加齢・引退判定と成績リセットを行い、7月1日から新シーズンが始まります。</p>
    <button class="btn primary wide" data-act="skip-off">7月1日までスキップ</button>
    <button class="btn ghost wide" data-act="day-by-day">1日ずつ進める</button></section>`;
}

function renderRoster() {
  const m = me(), r = sortRoster(active(m));
  return `<section class="card"><div class="ch-row"><h2 class="ch">選手名簿<small>${r.length}/${MAX_ROSTER}人</small></h2><button class="chip btnchip" data-act="sheet" data-arg="formation">${m.formation} ▾</button></div>
    ${rowHead()}<div class="plist">${r.map(p => playerRow(p, { act: "pdetail-mine", idx: m.roster.indexOf(p) })).join("")}</div>
    <p class="muted small">選手をタップすると能力の詳細と解雇ができます。</p></section>`;
}

function renderTable() {
  const m = me();
  const key = T.standDiv || G.country + m.division;
  const segs = [...COUNTRIES.flatMap(c => [1, 2].map(d => [c.id + d, c.leagues[d - 1]])), ["cup", CUP_NAME]];
  let inner;
  if (key === "cup") {
    const cd = cupDates(G.season_year);
    const sched = Object.entries(cd).map(([ds, n]) => `<li class="${ds < G.date ? "past" : ""}"><span>${shortDate(ds)}</span><b>${n}</b></li>`).join("");
    inner = `<p class="muted small">5大リーグの上位32クラブによるノックアウト方式。</p><ul class="cupdates">${sched}</ul>${G.cup_teams.length > 1 ? cupBracketBlock() : `<p>今季の${CUP_NAME}は終了しました。優勝: <b>${h(G.teams[G.cup_teams[0]].name)}</b></p>`}`;
  } else {
    const cid = key.slice(0, 3), d = Number(key.slice(3));
    const played = G.lg[key].round, total = G.lg[key].schedule.length;
    inner = `<h2 class="ch">${h(leagueName(cid, d))}<small>${h(countryInfo(cid).name)} · 第${played}節終了（全${total}節）</small></h2>` +
      standingsTable(teamRows(standings(d, cid))) +
      `<p class="muted small">${d === 1 ? `下位3クラブが降格。上位${CUP_QUOTA[cid]}クラブが来季の${CUP_NAME}へ。` : "上位3クラブが昇格。"}チーム名をタップすると名簿を見られます。</p>`;
  }
  return `<section class="card"><div class="chiprow">${segs.map(([k, l]) => `<button class="${key === k ? "on" : ""}" data-act="stand-div" data-arg="${k}">${h(l)}</button>`).join("")}</div>${inner}</section>`;
}

function renderGoals() {
  const view = T.recView || "now";
  const top = `<div class="seg wide">${[["now", "今季の記録"], ["hist", "歴代シーズン"]].map(([k, l]) => `<button class="${view === k ? "on" : ""}" data-act="rec-view" data-arg="${k}">${l}</button>`).join("")}</div>`;
  return `<section class="card">${top}${view === "hist" ? renderHistory() : renderNow()}</section>`;
}
function statSeg() {
  const st = T.statKind || "goals";
  return `<div class="seg">${[["goals", "得点"], ["assists", "アシスト"]].map(([k, l]) => `<button class="${st === k ? "on" : ""}" data-act="stat-kind" data-arg="${k}">${l}</button>`).join("")}</div>`;
}
function renderNow() {
  const mode = T.scorerMode || G.country + me().division;
  const modes = [...COUNTRIES.flatMap(c => [1, 2].map(d => [c.id + d, c.leagues[d - 1]])), ["cup", CUP_NAME], ["news", "移籍ニュース"]];
  const chips = `<div class="chiprow">${modes.map(([k, l]) => `<button class="${mode === k ? "on" : ""}" data-act="scorer-mode" data-arg="${k}">${h(l)}</button>`).join("")}</div>`;
  if (mode === "news") {
    const news = G.news || [];
    return chips + `<h2 class="ch">移籍ニュース<small>移籍期間（1・7・8月）の日曜日に成立</small></h2>` + (news.length ? `<ul class="news">${news.slice(0, 150).map(n => `<li><span class="nd">${shortDate(n.date)}</span><div><b>${h(n.name)}</b><small>${n.pos}・${n.age}歳・総合${n.ovr}</small><span>${h(n.from)} → ${h(n.to)}</span></div><em>${yen(n.fee)}</em></li>`).join("")}</ul>` : `<p class="muted">まだ移籍は成立していません。移籍期間の日曜日にクラブ同士の移籍が発生します。</p>`);
  }
  const st = T.statKind || "goals";
  const title = mode === "cup" ? CUP_NAME : leagueName(mode.slice(0, 3), Number(mode.slice(3)));
  return chips + `<div class="ch-row"><h2 class="ch">${st === "goals" ? "得点" : "アシスト"}ランキング<small>${h(title)}</small></h2>${statSeg()}</div>${scorerList(topScorers(mode, 10, st), st === "goals" ? "点" : "A")}`;
}
function renderHistory() {
  const hist = G.history || [];
  if (!hist.length) return `<div class="empty"><b>まだ終わったシーズンがありません</b><p class="muted small">シーズンが終わると、全リーグの最終順位表・得点王・アシスト王と、あなたのクラブの成績がここに残ります。</p></div>`;
  const idx = Math.min(T.histIdx ?? hist.length - 1, hist.length - 1);
  const rec = hist[idx];
  const seasons = `<div class="chiprow">${hist.map((r, i) => [r, i]).reverse().map(([r, i]) => `<button class="${i === idx ? "on" : ""}" data-act="hist-season" data-arg="${i}">${r.year}/${String(r.year + 1).slice(2)}</button>`).join("")}</div>`;
  const kn = k => leagueName(k.slice(0, 3), Number(k.slice(3)));
  const m = rec.my;
  const myCard = `<div class="hist-me">${crest(rec.club, 44)}<div><b>${h(rec.club)}</b><span>${h(kn(m.key))} <em>${m.rank}位</em> / ${m.n}クラブ</span>
    <small>${m.w}勝${m.d}分${m.l}敗 · 勝点${m.pts} · ${m.gf}得点${m.ga}失点 · ${CUP_NAME}: ${h(m.cup)}</small>
    ${m.topGoals || m.topAssists ? `<small>チーム得点王 ${m.topGoals ? `${h(m.topGoals[0])} ${m.topGoals[1]}点` : "—"} · アシスト ${m.topAssists ? `${h(m.topAssists[0])} ${m.topAssists[1]}` : "—"}</small>` : ""}</div></div>`;
  const champs = `<h3 class="sh">各リーグの優勝</h3><ul class="hist-champs">${leagueKeys().map(k => { const t = rec.leagues[k] && rec.leagues[k].table[0]; return t ? `<li><span>${h(kn(k))}</span><b>${crest(t[0], 18)}${h(t[0])}</b></li>` : ""; }).join("")}
    ${rec.cup && rec.cup.winner ? `<li class="cupw"><span>${CUP_NAME}</span><b>${crest(rec.cup.winner, 18)}${h(rec.cup.winner)}</b></li>` : ""}</ul>`;
  const key = T.histKey || m.key;
  const keyChips = `<div class="chiprow">${[...leagueKeys().map(k => [k, kn(k)]), ["cup", CUP_NAME]].map(([k, l]) => `<button class="${key === k ? "on" : ""}" data-act="hist-key" data-arg="${k}">${h(l)}</button>`).join("")}</div>`;
  const st = T.statKind || "goals";
  const L = key === "cup" ? rec.cup : rec.leagues[key];
  const rows = (L ? L[st] : []).map(([n, t, g]) => ({ name: n, team: t, goals: g, mine: t === rec.club }));
  const table = key !== "cup" && L ? standingsTable(L.table.map(([n, w, d, l, gf, ga, pts]) => ({ name: n, mine: n === rec.club, p: w + d + l, pts, w, d, l, gf, ga }))) : "";
  return seasons + myCard + champs + `<h3 class="sh">リーグ別の記録</h3>` + keyChips +
    (table ? `<details class="fold" open><summary>最終順位表</summary>${table}</details>` : "") +
    `<div class="ch-row"><h3 class="sh">${st === "goals" ? "得点王" : "アシスト王"}</h3>${statSeg()}</div>${scorerList(rows, st === "goals" ? "点" : "A")}`;
}

             : `<button class="btn ghost wide dangertxt" data-act="reset-ask">キャリアを消して最初から</button>`}

// ---------------- シート（下から出るパネル） ----------------
function openSheet(s) { T.sheets.push(s); renderSheet(); }
function closeSheet(all) { if (all) T.sheets = []; else T.sheets.pop(); renderSheet(); render(); }
function renderSheet() {
  const s = T.sheets[T.sheets.length - 1];
  if (!s) { $sheet.hidden = true; $sheet.innerHTML = ""; document.body.classList.remove("sheet-on"); return; }
  document.body.classList.add("sheet-on");
  $sheet.hidden = false;
  const content = SHEETS[s.kind](s);
  $sheet.innerHTML = `<div class="scrim" data-act="sheet-close"></div><div class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><button class="iconbtn" data-act="sheet-close" aria-label="戻る">${T.sheets.length > 1 ? "‹" : "×"}</button><h2>${content.title}</h2></div>
    <div class="panel-body">${content.body}</div></div>`;
}

const SHEETS = {
  player(s) {
    const p = s.p, ovr = getOvr(p);

  formation() {

  starters(s) {
    const m = me(); const req = FORMATIONS[m.formation];

  crests(s) {

      <div class="crestgrid">${list.map(n => `<button class="crestcell ${CREST_IMG[n] ? "set" : ""}" data-act="crest-pick" data-arg="${h(n)}">${crest(n, 44)}<span>${h(n)}</span></button>`).join("")}</div>` };

  intensive(s) {

      return { title: "個別特訓", body: `<div class="pd-top"><span class="pos pos-${p.pos} lg">${p.pos}</span><div class="pd-id"><b>${h(p.name)}</b><small>${p.age}歳 · 体力 ${p.condition}%</small></div><div class="pd-ovr ${ovrClass(getOvr(p))}"><small>総合</small>${getOvr(p)}</div></div>
        <p>体力 -45・疲労 +25 と引き換えに、1〜3項目の能力が1〜3ずつ上がります。スキル未所持なら5%で覚醒。3%でオーバーワークによる負傷のリスクがあります。</p>
        ${ok ? `<button class="btn primary wide" data-act="int-go">この選手を強化指定する</button>` : `<p class="bad">体力が足りません（必要: 50以上）。休養させてください。</p>`}

  scout(s) {
    const m = me();
    if (m.scout_status === "SEARCHING") return { title: "ユーススカウト", body: `<p>現在スカウトが各地を飛び回っています。報告まであと <b>${m.scout_timer}</b> 日です。${m.scout_target_pos ? `（ターゲット: ${m.scout_target_pos}）` : ""}</p>` };
    if (m.scout_status === "READY") {
      return { title: "スカウト報告：発掘された逸材", body: `<p class="muted small">1人だけ獲得できます。獲得すると報告は終了します。</p>${rowHead()}<div class="plist">${m.scout_candidates.map((p, i) => playerRow(p, { act: "scout-view", idx: i })).join("")}</div>
        <div class="row2"><button class="btn ghost" data-act="sheet-close">保持して戻る</button><button class="btn ghost dangertxt" data-act="scout-discard">報告を破棄する</button></div>` };

      <div class="grid2">
        <button class="act ${sel === "1" ? "on" : ""}" data-act="scout-dest" data-arg="1"><b>国内調査</b><small>1,000円 · 3日間 · 期待度:中</small></button>
        <button class="act ${sel === "2" ? "on" : ""}" data-act="scout-dest" data-arg="2"><b>海外調査</b><small>5,000円 · 14日間 · 期待度:高</small></button>
      </div>
      ${sel ? `<h3 class="sh">どのポジションを重点的に探しますか？</h3><div class="seg wide">${posBtns.map(([k, l]) => `<button data-act="scout-go" data-arg="${k}">${l}</button>`).join("")}</div>` : ""}
      ${m.scout_boost ? `<p class="rare small">噂の逸材の情報があります。次の調査で有望な選手が見つかりやすくなります。</p>` : ""}` };
  },
  facility(s) {
    const m = me(); const f = m.facilities;
    const rows = [["medical", "メディカルセンター", "怪我減少・回復UP"], ["training", "トレーニングジム", "特訓効率UP"], ["youth", "ユースアカデミー", "スカウトの才能UP"]];
    return { title: "クラブ施設投資", body: `<p>予算: <b class="${m.money < 0 ? "bad" : ""}">${yen(m.money)}</b></p>
      ${rows.map(([k, n, d]) => { const lv = f[k], cost = lv * 10000; const conf = s.confirm === k;
        return `<div class="fac"><div><b>${n}</b><small>${d}</small><span class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= lv ? "on" : ""}"></i>`).join("")} Lv.${lv}</span></div>
          ${lv >= 5 ? `<span class="chip">最大</span>` : conf ? `<div class="row2"><button class="btn ghost sm" data-act="fac-cancel">やめる</button><button class="btn primary sm" data-act="fac-go" data-arg="${k}">${yen(cost)}で強化</button></div>`
          : `<button class="btn sm" data-act="fac-ask" data-arg="${k}" ${m.money < cost ? "disabled" : ""}>Lv.${lv + 1}へ<small>${yen(cost)}</small></button>`}</div>`; }).join("")}` };
  },
  market(s) {
    const m = me();
    if (!T.market || T.marketDate !== G.date) buildMarket();
    const msg = s.msg ? logList([s.msg]) : "";
    return { title: "移籍市場：本日のリスト", body: `<p>現在の所持金: <b class="${m.money < 0 ? "bad" : ""}">${yen(m.money)}</b> · 登録 ${m.roster.length}/${MAX_ROSTER}</p>${msg}
      ${rowHead("価格", "mk")}<div class="plist">${T.market.map((it, i) => playerRow(it.player, { act: "mk-view", idx: i, team: it.fromIdx != null ? `${crest(G.teams[it.fromIdx].name, 14)}${h(G.teams[it.fromIdx].name)}` : "無所属（FA）", cls: "mk", right: priceCell(it.player.value, m.money) })).join("")}</div>
      ${!T.market.length ? `<p class="muted">リストに残っている選手はいません。</p>` : ""}` };
  },
};

function currentOpp() {
  const d = G.day, m = me();
  if (d.phase === "cup") return cupOpponent();
  if (d.phase === "saturday" && d.isMatch) { const list = divTeams(m.division), st = myLeague(); for (const [hi, ai] of st.schedule[st.round]) { if (list[hi] === m) return list[ai]; if (list[ai] === m) return list[hi]; } }
  return null;
}

function buildMarket() {
  const list = [];
  const fixed = DATA.FIXED_PLAYERS || [];
  if (fixed.length && rnd() < 0.05) list.push({ player: createPlayer({ fixed: choice(fixed) }), fromIdx: null });
  const tmp = [];
  G.teams.forEach((t, i) => { if (i === G.myIdx) return; if (t.roster.length > 18) tmp.push({ player: choice(t.roster), fromIdx: i }); });
  shuffle(tmp);
  list.push(...tmp.slice(0, 5));
  for (let i = 0; i < 5; i++) list.push({ player: createPlayer({ quality: "scout_high" }), fromIdx: null });
  shuffle(list);
  T.market = list.slice(0, 8); T.marketDate = G.date;
}

const topSheet = () => T.sheets[T.sheets.length - 1];
const ACTIONS = {

  "new-career"() { T.world = null; T.pick.idx = null; T.title = "pick"; render(); window.scrollTo(0, 0); },

  "title-back"() { T.title = true; render(); },

  rest() { actRest(); window.scrollTo(0, 0); },
  "rest-until"() { actRestUntilMatch(); window.scrollTo(0, 0); },
  "end-day"() { endDay(); window.scrollTo(0, 0); },
  "end-week"() { simulateRivalManagement(); endDay(); window.scrollTo(0, 0); },
  "league-play"(a) { playLeague(a === "live"); },
  "cup-play"(a) { playCup(a === "live"); },
  "live-speed"(s) { setLiveSpeed(Number(s)); },
  "live-close"() { closeLive(); },
  "ht-out"(i) { T.live.sel = T.live.ht.onPitch[Number(i)]; renderLive(); },

  "cer-next"() { G.day.step += 1; persist(); render(); window.scrollTo(0, 0); },

    const o = G.day.offer, m = me(), p = findOfferPlayer(o), team = G.teams[o.teamIdx];
    if (a === "yes") {
      if (active(m).length <= 15) o.msg = L("❌ 選手層が薄すぎるため、会長から売却の許可が下りませんでした。", "bad");
      else { m.money += o.price; m.roster.splice(m.roster.indexOf(p), 1); team.roster.push(p); o.msg = L(`✅ ${p.name} は ${team.name} へ移籍しました。資金 ${yen(o.price)} を獲得しました。`, "good"); }
    } else o.msg = L(`契約延長を提示し、${team.name} からのオファーを拒否しました。`);
    o.status = "done"; persist(); render();
  },
  sheet(kind) { openSheet({ kind }); },

  "int-pick"(i) { topSheet().p = me().roster[Number(i)]; renderSheet(); },

  "buy-cancel"() { topSheet().confirmBuy = false; renderSheet(); },
  "buy-go"() {
    const s = topSheet(), m = me(), it = T.market[s.idx], p = it.player;
    T.market.splice(s.idx, 1);
    let msg;
    if (rnd() < 0.10) {
      msg = L(`❌ 移籍破談: ${choice(["選手との個人合意に達しませんでした（給与面での不一致）。", "メディカルチェックの結果、過去の負傷箇所に懸念が見つかりました。", "他クラブがより好条件を提示し、選手を強奪されました。", "労働許可証（ワークパーミット）の発行が却下されました。"])}`, "bad");
    } else {
      m.money -= p.value;
      if (it.fromIdx != null) { const ft = G.teams[it.fromIdx]; ft.money += p.value; const k = ft.roster.indexOf(p); if (k >= 0) ft.roster.splice(k, 1); }
      m.roster.push(p);
      msg = L(`✅ ${p.name} が ${m.name} に電撃移籍しました！`, "good");
    }
    T.sheets.pop(); topSheet().msg = msg; persist(); renderSheet(); render();
  },
  "stand-div"(k) { T.standDiv = k; render(); },
  "team-view"(i) { openSheet({ kind: "team", t: G.teams[Number(i)] }); },
  "crest-pick"(name) { T.crestTarget = name; const inp = document.getElementById("crestIn"); inp.value = ""; inp.click(); },
  "crest-clear"(name) { clearCrestImage(name); toast("エンブレムを元に戻しました"); },
  "crest-league"(k) { topSheet().key = k; renderSheet(); },
  "pdetail-team"(i) { const s = topSheet(); openSheet({ kind: "player", p: s.t.roster[Number(i)], team: s.t.name }); },
  "scorer-mode"(k) { T.scorerMode = k; render(); },
  "rec-view"(k) { T.recView = k; render(); },
  "stat-kind"(k) { T.statKind = k; render(); },
  "hist-season"(i) { T.histIdx = Number(i); render(); },
  "hist-key"(k) { T.histKey = k; render(); },
  async save() { persist(); const ok = await cloudSave(); toast(ok ? "端末とクラウドにセーブしました" : "端末にセーブしました", "good"); render(); },
  async export() {
    const data = exportSave();
    const name = `soccer_save_${G.date}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: name, data }); return; }
    } catch (e) { if (e && e.code === "declined") return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; a.click(); } catch (e) { toast("書き出せませんでした", "bad"); }
  },
  "to-title"() { persist(); T.title = true; T.sheets = []; render(); },
  "reset-ask"() { T.confirm = "reset"; render(); },
  "confirm-cancel"() { T.confirm = null; render(); },
  "reset-go"() { try { localStorage.removeItem(LS_KEY); } catch (e) {} G = null; T.confirm = null; T.title = true; render(); },
};
// スカウト候補の獲得（選手詳細シートから）
SHEETS._player = SHEETS.player;
SHEETS.player = s => {
  const c = SHEETS._player(s);
  if (s.mode === "scout") {
    const m = me();
    c.body += m.roster.length >= MAX_ROSTER ? `<p class="bad">チームが満員（${MAX_ROSTER}人）です。</p>` : `<button class="btn primary wide" data-act="scout-take">ユースから昇格させる</button>`;
  }
  return c;
};
ACTIONS["scout-take"] = () => {
  const s = topSheet(), m = me();
  const p = m.scout_candidates.splice(s.idx, 1)[0];
  p.league_goals = 0; p.cup_goals = 0;
  m.roster.push(p);
  m.scout_status = "IDLE"; m.scout_candidates = [];
  persist(); closeSheet(true); toast(`${p.name} がユースから昇格しました！`, "good");
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg); }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "fileIn") return;
  const f = e.target.files[0]; if (!f) return;
  try { G = migrateSave(JSON.parse(await f.text())); T.title = false; T.tab = "home"; beginDay([L("📂 セーブファイルを読み込みました。", "head")]); }
  catch (err) { toast("読み込めませんでした: " + err.message, "bad"); }
});
document.addEventListener("change", e => {
  if (e.target.id !== "crestIn" || !T.crestTarget) return;
  const f = e.target.files[0]; if (f) setCrestImage(T.crestTarget, f);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && T.sheets.length) closeSheet(); });

// 起動
(function boot() {
  render();
  initCloud();
})();

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
