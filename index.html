  "int-go"() { const s = topSheet(); s.result = intensiveTraining(s.p); persist(); renderSheet(); },
  "int-finish"() { const s = topSheet(); const logs = [L(`▶ ${shortDate(G.date)} 個別特訓: ${s.p.name}`, "sub"), ...s.result]; T.sheets = []; renderSheet(); endDay(logs); window.scrollTo(0, 0); },
  "scout-dest"(k) { topSheet().dest = k; renderSheet(); },
  "scout-go"(pos) {
    const m = me(), dest = topSheet().dest;
    const [cost, days] = dest === "1" ? [1000, 3] : [5000, 14];
    if (m.money < cost) { toast("資金が足りません", "bad"); return; }
    m.scout_target_pos = pos || null; m.money -= cost; m.scout_status = "SEARCHING"; m.scout_timer = days; m.scout_type = dest === "1" ? "domestic" : "overseas";
    persist(); closeSheet(); toast(dest === "1" ? "国内へスカウトを派遣しました" : "全世界へスカウトを派遣しました");
  },
  "scout-view"(i) { const p = me().scout_candidates[Number(i)]; openSheet({ kind: "player", p, mode: "scout", idx: Number(i) }); },
  "scout-discard"() { const m = me(); m.scout_status = "IDLE"; m.scout_candidates = []; persist(); closeSheet(); toast("報告を破棄しました"); },
  "fac-ask"(k) { topSheet().confirm = k; renderSheet(); },
  "fac-cancel"() { topSheet().confirm = null; renderSheet(); },
  "fac-go"(k) { const m = me(), lv = m.facilities[k], cost = lv * 10000; if (m.money >= cost && lv < 5) { m.money -= cost; m.facilities[k] += 1; persist(); toast("施設のレベルが上がりました"); } topSheet().confirm = null; renderSheet(); render(); },
  "mk-view"(i) { const it = T.market[Number(i)]; openSheet({ kind: "player", p: it.player, mode: "market", idx: Number(i), team: it.fromIdx != null ? G.teams[it.fromIdx].name : "無所属（FA）" }); },
  "buy-ask"() { topSheet().confirmBuy = true; renderSheet(); },
  "buy-cancel"() { topSheet().confirmBuy = false; renderSheet(); },
  "buy-go"() {
    const s = topSheet(), m = me(), it = T.market[s.idx], p = it.player;
    T.market.splice(s.idx, 1);
    let msg;
    if (rnd() < 0.10) {
      msg = L(`❌ 移籍破談: ${choice(["選手との個人合意に達しませんでした（給与面での不一致）。", "メディカルチェックの結果、過去の負傷箇所に懸念が見つかりました。", "他クラブがより好条件を提示し、選手を強奪されました。", "労働許可証（ワークパーミット）の発行が却下されました。"])}`, "bad");
    } else {
      m.money -= p.value;
      if (it.fromIdx != null) { const ft = G.teams[it.fromIdx]; ft.money += p.value; const k = ft.roster.indexOf(p); if (k >= 0) ft.roster.splice(k, 1); }
      m.roster.push(p);
      if (it.legend) legendState().market = null;
      msg = L(it.legend ? `🌟 伝説の名選手 ${p.name} が ${m.name} に加入しました！` : `✅ ${p.name} が ${m.name} に電撃移籍しました！`, "good");
    }
    T.sheets.pop(); topSheet().msg = msg; persist(); renderSheet(); render();
  },
  "stand-div"(k) { T.standDiv = k; render(); },
  "team-view"(i) { openSheet({ kind: "team", t: G.teams[Number(i)] }); },
  "crest-pick"(name) { T.crestTarget = name; const inp = document.getElementById("crestIn"); inp.value = ""; inp.click(); },
  "crest-clear"(name) { clearCrestImage(name); toast("エンブレムを元に戻しました"); },
  "crest-league"(k) { topSheet().key = k; renderSheet(); },
  "pdetail-team"(i) { const s = topSheet(); openSheet({ kind: "player", p: s.t.roster[Number(i)], team: s.t.name }); },
  "scorer-mode"(k) { T.scorerMode = k; render(); },
  "rec-view"(k) { T.recView = k; render(); },
  "stat-kind"(k) { T.statKind = k; render(); },
  "hist-season"(i) { T.histIdx = Number(i); render(); },
  "hist-key"(k) { T.histKey = k; render(); },
  async save() { persist(); const ok = await cloudSave(); toast(ok ? "端末とクラウドにセーブしました" : "端末にセーブしました", "good"); render(); },
  async export() {
    const data = exportSave();
    const name = `soccer_save_${G.date}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: name, data }); return; }
    } catch (e) { if (e && e.code === "declined") return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; a.click(); } catch (e) { toast("書き出せませんでした", "bad"); }
  },
  "to-title"() { persist(); T.title = true; T.sheets = []; render(); },
  "reset-ask"() { T.confirm = "reset"; render(); },
  "confirm-cancel"() { T.confirm = null; render(); },
  "reset-go"() { try { localStorage.removeItem(LS_KEY); } catch (e) {} G = null; T.confirm = null; T.title = true; render(); },
};
// スカウト候補の獲得（選手詳細シートから）
SHEETS._player = SHEETS.player;
SHEETS.player = s => {
  const c = SHEETS._player(s);
  if (s.mode === "scout") {
    const m = me();
    c.body += m.roster.length >= MAX_ROSTER ? `<p class="bad">チームが満員（${MAX_ROSTER}人）です。</p>` : (s.p.legend ? (m.money < s.p.value ? `<p class="bad">資金が足りません（移籍金 ${yen(s.p.value)}）。</p>` : `<button class="btn primary wide" data-act="scout-take">移籍金 ${yen(s.p.value)} で獲得する</button>`) : `<button class="btn primary wide" data-act="scout-take">ユースから昇格させる</button>`);
  }
  return c;
};
ACTIONS["scout-take"] = () => {
  const s = topSheet(), m = me();
  const cand = m.scout_candidates[s.idx];
  if (cand && cand.legend) {   // レジェンドは移籍金が必要
    if (m.money < cand.value) { toast("資金が足りません", "bad"); return; }
    m.money -= cand.value;
  }
  const p = m.scout_candidates.splice(s.idx, 1)[0];
  p.league_goals = 0; p.cup_goals = 0;
  m.roster.push(p);
  m.scout_status = "IDLE"; m.scout_candidates = [];
  persist(); closeSheet(true); toast(p.legend ? `🌟 伝説の名選手 ${p.name} が加入しました！` : `${p.name} がユースから昇格しました！`, "good");
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.arg); }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "fileIn") return;
  const f = e.target.files[0]; if (!f) return;
  try { G = migrateSave(JSON.parse(await f.text())); T.title = false; T.tab = "home"; beginDay([L("📂 セーブファイルを読み込みました。", "head")]); }
  catch (err) { toast("読み込めませんでした: " + err.message, "bad"); }
});
document.addEventListener("change", e => {
  if (e.target.id !== "crestIn" || !T.crestTarget) return;
  const f = e.target.files[0]; if (f) setCrestImage(T.crestTarget, f);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && T.sheets.length) closeSheet(); });

// 起動
(function boot() {
  render();
  initCloud();
})();

// ===== 戦術タブ（フォーメーション・選手配置・攻撃スタイル・守備ライン・キャプテン・キッカー） =====
// 自チームの設定は me().tactics に保存する（選手は名前で持つ）。
//   lineup: フォーメーションの各ポジション（slotsFor の順）に入る選手の名前 11人分
//   style / line: 攻撃スタイル・守備ライン（TAC_STYLE / TAC_LINE）
//   captain / ck / fk / pk: 指名した選手の名前（空ならおまかせ）

const ROLE_KEY = {
  GK: p => p.reflexes * 1.5 + p.handling,
  DF: p => p.tackling + p.marking + p.strength * .5,
  MF: p => p.passing + p.vision + p.stamina * .5,
  FW: p => p.finishing + p.acceleration + p.speed * .5,
};
const roleFit = (p, role) => (p.pos === role ? 1000 : 0) + (ROLE_KEY[role] ? ROLE_KEY[role](p) : getOvr(p));
const myTac = () => { const m = me(); m.tactics = m.tactics || { style: "balance", line: "mid" }; return m.tactics; };
const usable = p => p && !p.retired && !(p.injury_days > 0);

// 今の設定から11人を並べる（けが人や移籍でいなくなった選手は、その位置に合う選手で自動的に埋める）
function myLineup() {
  const m = me(), tac = myTac(), slots = slotsFor(m.formation || "4-4-2");
  const avail = m.roster.filter(usable);
  const used = new Set(), res = [], auto = [];
  slots.forEach((s, i) => {
    const n = (tac.lineup || [])[i];
    const p = n ? avail.find(q => q.name === n && !used.has(q)) : null;
    res[i] = p || null; if (p) used.add(p);
  });
  slots.forEach((s, i) => {
    if (res[i]) return;
    const c = avail.filter(p => !used.has(p)).sort((a, b) => roleFit(b, s.role) - roleFit(a, s.role))[0];
    res[i] = c || null; if (c) { used.add(c); if ((tac.lineup || [])[i]) auto.push(i); }
  });
  return { players: res, slots, auto };
}
// 試合で使う先発（並び順＝ポジション順）
function matchStarters() {
  const { players } = myLineup();
  return players.every(Boolean) ? players : null;
}
const saveLineup = players => { myTac().lineup = players.map(p => (p ? p.name : null)); };
function autoLineup() {
  const m = me();
  const st = getStarters(m);
  saveLineup(formationSlots(st, m.formation || "4-4-2").map(x => x.p));
}
// フォーメーションを変えるときは、今の先発メンバーをなるべく残して新しい形に並べ直す
function changeFormation(k) {
  const m = me(); const cur = myLineup().players.filter(Boolean);
  m.formation = k;
  saveLineup(formationSlots(cur, k).map(x => x.p));
}

function renderTactics() {
  const m = me(), tac = myTac();
  const { players, slots, auto } = myLineup();
  const inXI = new Set(players.filter(Boolean));
  const avg = players.filter(Boolean).length ? Math.round(sum(players.filter(Boolean).map(getOvr)) / players.filter(Boolean).length) : 0;
  // ピッチ（上が相手ゴール）
  const board = slots.map((s, i) => {
    const p = players[i];
    const top = Math.max(6, Math.min(92, (0.95 - s.lx * 1.25) * 100)), left = Math.max(9, Math.min(91, s.ly * 100));
    const off = p && p.pos !== s.role;
    const cond = p ? Math.max(0, Math.min(100, p.condition)) : 0;
    return `<button class="tslot ${off ? "off" : ""} ${auto.includes(i) ? "auto" : ""}" style="top:${top}%;left:${left}%" data-act="tac-slot" data-arg="${i}">
      <span class="pos pos-${s.role}">${s.role}</span>
      <b>${p ? h(shortNm(p.name)) : "—"}</b>
      <small>${p ? `${getOvr(p)}${p.name === tac.captain ? " ©" : ""}` : ""}</small>
      ${p ? `<i class="tcond ${cond < 50 ? "low" : ""}"><em style="width:${cond}%"></em></i>` : ""}</button>`;
  }).join("");
  const bench = sortRoster(m.roster.filter(p => !p.retired && !inXI.has(p)));
  const st = TAC_STYLE[tac.style] || TAC_STYLE.balance, ln = TAC_LINE[tac.line] || TAC_LINE.mid;
  const pickRow = (key, label, hint) => {
    const n = tac[key]; const p = n ? players.find(q => q && q.name === n) : null;
    return `<button class="tpick" data-act="sheet" data-arg="tacpick:${key}"><span>${label}</span><b>${p ? h(p.name) : n ? `<s>${h(n)}</s> → おまかせ` : "おまかせ"}</b><small>${hint}</small></button>`;
  };
  return `<section class="card"><div class="ch-row"><h2 class="ch">フォーメーション<small>先発平均 ${avg}</small></h2></div>
      <div class="fchips">${Object.keys(FORMATIONS).map(k => `<button class="${m.formation === k ? "on" : ""}" data-act="tac-form" data-arg="${k}">${k}</button>`).join("")}</div>
      <div class="tboard"><div class="tlines"></div>${board}</div>
      <p class="muted small">ポジションをタップすると選手を入れ替えられます。${players.some((p, i) => p && p.pos !== slots[i].role) ? `<span class="bad">赤い枠は本来のポジションではない選手です。</span>` : ""}${auto.length ? `<br><span class="bad">けが人などがいたため、点線の位置は自動で入れ替えています。</span>` : ""}</p>
      <button class="btn ghost wide" data-act="tac-auto">おまかせで並べる</button></section>
    <section class="card"><h2 class="ch">攻撃スタイル</h2>
      <div class="seg tseg">${Object.entries(TAC_STYLE).map(([k, v]) => `<button class="${tac.style === k ? "on" : ""}" data-act="tac-style" data-arg="${k}">${v.name}</button>`).join("")}</div>
      <p class="tdesc">${h(st.desc)}</p>
      <h2 class="ch">守備ライン・プレス</h2>
      <div class="seg tseg">${Object.entries(TAC_LINE).map(([k, v]) => `<button class="${tac.line === k ? "on" : ""}" data-act="tac-line" data-arg="${k}">${v.name.replace(/（.*）/, "")}</button>`).join("")}</div>
      <p class="tdesc">${h(ln.name)}：${h(ln.desc)}</p></section>
    <section class="card"><h2 class="ch">キャプテン・キッカー<small>先発の選手から選びます</small></h2>
      <div class="tpicks">
        ${pickRow("captain", "キャプテン", "統率力が中盤の主導権争いに効く")}
        ${pickRow("ck", "コーナーキック", "クロス精度")}
        ${pickRow("fk", "フリーキック", "パス・決定力・冷静さ")}
        ${pickRow("pk", "PK", "冷静さ・決定力")}
      </div></section>
    <section class="card"><h2 class="ch">控え<small>${bench.length}人</small></h2>${rowHead()}<div class="plist">${bench.map(p => playerRow(p, { act: "pdetail-mine", idx: m.roster.indexOf(p) })).join("")}</div></section>`;
}
const shortNm = n => { const s = String(n); if (s.includes("・")) return s.split("・").pop(); if (s.includes(" ")) return s.split(" ")[0]; return s; };

// ---- シート：ポジションに入れる選手を選ぶ / キャプテン・キッカーを選ぶ ----
SHEETS.tacslot = s => {
  const m = me(), { players, slots } = myLineup(), sl = slots[s.i], cur = players[s.i];
  const cands = m.roster.filter(p => !p.retired && p !== cur).sort((a, b) => (usable(b) - usable(a)) || roleFit(b, sl.role) - roleFit(a, sl.role));
  const where = p => { const j = players.indexOf(p); return j >= 0 ? ["xi", `先発${slots[j].role}`] : p.injury_days > 0 ? ["inj", "負傷"] : ["bench", "控え"]; };
  return { title: `${sl.role} に入れる選手`, body: `${cur ? `<p class="muted small">今：${h(cur.name)}（${cur.pos}・総合${getOvr(cur)}）</p>` : ""}${rowHead()}
    <div class="plist">${cands.map(p => playerRow(p, { act: usable(p) ? "tac-put" : "", idx: m.roster.indexOf(p), cls: p.pos === sl.role ? "fit" : "", right: `<span class="twhere ${where(p)[0]}">${where(p)[1]}</span>` })).join("")}</div>
    <p class="muted small">緑の線は本来のポジションが ${sl.role} の選手です。先発の選手を選ぶと位置を入れ替えます。</p>` };
};
const PICK_LABEL = { captain: ["キャプテン", p => p.leadership, "統率"], ck: ["コーナーキッカー", p => p.crossing, "クロス"], fk: ["フリーキッカー", p => Math.round(p.passing * .5 + p.finishing * .3 + p.composure * .2), "FK力"], pk: ["PKキッカー", p => Math.round(p.composure * .6 + p.finishing * .4), "PK力"] };
SHEETS.tacpick = s => {
  const [label, f, unit] = PICK_LABEL[s.key];
  const ps = myLineup().players.filter(Boolean).sort((a, b) => f(b) - f(a));
  const cur = myTac()[s.key];
  return { title: `${label}を選ぶ`, body: `<button class="btn wide ${!cur ? "primary" : ""}" data-act="tac-pick" data-arg="">おまかせ（試合ごとに一番向いている選手）</button>
    <div class="plist">${ps.map(p => playerRow(p, { act: "tac-pick", idx: me().roster.indexOf(p), cls: p.name === cur ? "sel" : "", right: `<span class="pcond"><b>${f(p)}</b><small> ${unit}</small></span>` })).join("")}</div>` };
};

Object.assign(ACTIONS, {
  "tac-form"(k) { changeFormation(k); T.starters = null; persist(); render(); },
  "tac-auto"() { autoLineup(); persist(); render(); toast("おまかせで並べました"); },
  "tac-style"(k) { myTac().style = k; persist(); render(); },
  "tac-line"(k) { myTac().line = k; persist(); render(); },
  "tac-slot"(i) { openSheet({ kind: "tacslot", i: Number(i) }); },
  "tac-put"(ri) {
    const s = topSheet(), m = me(), p = m.roster[Number(ri)];
    const { players } = myLineup(); const j = players.indexOf(p), cur = players[s.i];
    players[s.i] = p; if (j >= 0) players[j] = cur;      // 先発同士なら入れ替え
    saveLineup(players); persist(); closeSheet(); render();
  },
  "tac-pick"(ri) {
    const s = topSheet(); myTac()[s.key] = ri === "" || ri == null ? null : me().roster[Number(ri)].name;
    persist(); closeSheet(); render();
  },
});
// シート名に「tacpick:captain」のような引数を付けられるようにする
const _sheetAct = ACTIONS.sheet;
ACTIONS.sheet = k => { if (String(k).startsWith("tacpick:")) openSheet({ kind: "tacpick", key: k.split(":")[1] }); else _sheetAct(k); };

</script>
